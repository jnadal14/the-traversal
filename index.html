<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jacob Nadal — The Traversal</title>
    <link rel="icon" type="image/jpeg" href="FAVICON.jpg">
    <link rel="apple-touch-icon" href="FAVICON.jpg">
    <!-- Preload first-screen media + warm the mosaic so enter feels instant.
         Desktop pulls the 1080p landscape encode, phones the portrait crop, so
         neither downloads pixels the other will never show. Each poster is
         frame 0 of its own encode, which makes the poster->video swap invisible. -->
    <link rel="preload" href="IMAGES/video-posters/05_Icefileds_1.jpg?v=20260806" as="image" fetchpriority="high" media="(min-width: 769px)">
    <link rel="preload" href="IMAGES/video-posters/05_Icefileds_1-m.jpg?v=20260806" as="image" fetchpriority="high" media="(max-width: 768px)">
    <link rel="preload" href="CLIPS/05_Icefileds_1.mp4?v=20260806" as="video" type="video/mp4" media="(min-width: 769px)">
    <link rel="preload" href="CLIPS/mobile/05_Icefileds_1.mp4?v=20260806" as="video" type="video/mp4" media="(max-width: 768px)">
    <link rel="prefetch" href="mosaic.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Darker+Grotesque:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f5f5f0;
            --muted: rgba(245, 245, 240, 0.6);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Darker Grotesque', sans-serif;
            --hint-clearance: 4.5rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        a:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            /* Infinite loop remaps scroll — hide the bar so it never jumps */
            scrollbar-width: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Recommended Lenis styles */
        html.lenis, html.lenis body { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }

        /* Touch devices keep scrolling on Safari's compositor, matching the
           native-touch path used by the Dirty Aesthetic site. */
        html.native-snap {
            scroll-behavior: auto;
            scroll-snap-type: y mandatory;
        }
        html.native-snap .slide {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        a { color: inherit; text-decoration: none; }

        /* ---------- Slides ---------- */
        .slides { width: 100%; }

        .slide {
            position: relative;
            width: 100%;
            /* Keep the slide box stable while iOS Safari shows/hides its bars. */
            height: 100vh;
            overflow: hidden;
            overflow: clip;
            contain: paint;
            cursor: pointer;
            background: #050505;
        }

        .slide-media {
            position: absolute;
            /* Smaller overscan = less bleed at the infinite-scroll wrap */
            inset: -8% 0;
            height: 116%;
            will-change: transform;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .slide-media img,
        .slide-media video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            background: #050505;
        }

        .slide-media video {
            pointer-events: none;
        }

        .slide-media video::-webkit-media-controls-start-playback-button {
            display: none !important;
            -webkit-appearance: none;
        }

        .slide-media.media-focus-left img,
        .slide-media.media-focus-left video {
            object-position: left center;
        }

        /* Safari can briefly paint a video element black on a cold/private load,
           even when the native poster attribute is present. Keep a real image
           above it until the browser confirms that a video frame is drawable. */
        .slide-media .video-poster {
            z-index: 1;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.18s linear;
        }

        .slide.video-frame-ready .video-poster {
            opacity: 0;
            visibility: hidden;
        }

        /* Subtle vignette so captions stay legible */
        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 35%),
                        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%);
        }

        .slide-caption {
            position: absolute;
            left: clamp(1.25rem, 5vw, 4rem);
            right: clamp(1.25rem, 5vw, 4rem);
            bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 1.25rem;
            max-width: min(42rem, 100%);
            text-shadow: 0 1px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            /* Settles in as its slide takes the viewport. Toggled by a single
               class on slide change, never per frame. */
            opacity: 0;
            transform: translateY(0.9rem);
            transition:
                opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .slide.is-active .slide-caption {
            opacity: 1;
            transform: translateY(0);
        }

        /* The portrait encodes are already cropped to the framing these rules
           were approximating, so re-offsetting would push past the subject. */
        .slide-media.media-precropped img,
        .slide-media.media-precropped video {
            object-position: center center !important;
        }

        .slide-index {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--muted);
            padding-top: 0.6rem;
            flex-shrink: 0;
        }

        .slide-title-wrap { display: flex; flex-direction: column; min-width: 0; }

        .slide-title {
            font-family: var(--font-display);
            font-size: clamp(1.65rem, 4.8vw, 3.75rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0.01em;
        }

        .slide-sub {
            font-family: var(--font-body);
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.4rem;
        }

        /* ---------- Fixed UI ---------- */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: clamp(1rem, 3vw, 2rem) clamp(1.25rem, 5vw, 4rem);
            padding-top: max(clamp(1rem, 3vw, 2rem), env(safe-area-inset-top));
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .brand-mark { pointer-events: auto; min-width: 0; }

        .brand-mark .name {
            font-family: var(--font-display);
            font-size: clamp(1.15rem, 3.5vw, 1.35rem);
            font-weight: 500;
            display: block;
            line-height: 1.1;
        }

        .brand-mark .tagline {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .enter-link {
            pointer-events: auto;
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            transition: opacity 0.3s ease;
        }

        .enter-link .arrow { transition: transform 0.3s ease; }
        .enter-link:hover .arrow { transform: translateX(4px); }

        /* ---------- Progress rail ---------- */
        .slide-rail {
            position: fixed;
            right: clamp(0.9rem, 2vw, 1.75rem);
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.7rem;
            mix-blend-mode: difference;
        }

        .rail-tick {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            border: 0;
            padding: 0;
            background: rgba(255, 255, 255, 0.45);
            width: 0.75rem;
            height: 2px;
            border-radius: 2px;
            cursor: pointer;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.45s ease;
        }

        /* Widen the hit area well past the 2px visual without moving anything. */
        .rail-tick::before {
            content: '';
            position: absolute;
            width: 2.75rem;
            height: 1.1rem;
            transform: translate(-1.9rem, -0.55rem);
        }

        .rail-tick:hover { background: rgba(255, 255, 255, 0.8); }

        .rail-tick.is-active {
            width: 1.6rem;
            background: #fff;
        }

        /* Scroll / enter hint — always sits below captions */
        .hint {
            position: fixed;
            bottom: max(1rem, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: max-content;
            max-width: calc(100vw - 2rem);
            padding: 0 0.5rem;
            font-size: clamp(0.65rem, 2.4vw, 0.78rem);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            mix-blend-mode: difference;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            pointer-events: none;
            animation: floaty 2.6s ease-in-out infinite;
            white-space: nowrap;
        }

        .hint-full { display: inline; }
        .hint-short { display: none; }

        @keyframes floaty {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.75; }
            50% { transform: translate(-50%, 5px); opacity: 1; }
        }

        /* ---------- Enter / arrive veil ---------- */
        .enter-veil {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-veil.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        /* First paint: solid cover, no fade-in flash. Fade only on leave. */
        body.is-arriving .enter-veil.active {
            transition: none;
        }
        .enter-veil.is-fading {
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s;
        }

        .enter-veil-text {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(245, 245, 240, 0.85);
            opacity: 0.55;
            animation: veilPulse 1.6s ease-in-out infinite;
        }

        @keyframes veilPulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }

        body.is-arriving .top-bar,
        body.is-arriving .hint,
        body.is-arriving .slide-rail {
            opacity: 0;
        }

        body:not(.is-arriving) .top-bar,
        body:not(.is-arriving) .hint,
        body:not(.is-arriving) .slide-rail {
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
        }

        @media (prefers-reduced-motion: reduce) {
            .hint, .enter-veil-text { animation: none; }
            .slide-media { inset: 0; height: 100%; will-change: auto; }
            .enter-veil, .enter-veil.is-fading { transition: none !important; }
            /* Show every caption outright rather than sliding one in per slide. */
            .slide-caption {
                opacity: 1;
                transform: none;
                transition: none;
            }
            .rail-tick { transition: none; }
        }

        @media (max-width: 768px) {
            :root { --hint-clearance: 5.25rem; }

            .brand-mark .tagline { display: none; }

            /* Avoid expensive fixed-element blending/composited transforms over
               video; both are common sources of Safari scroll flashing. */
            .top-bar,
            .hint,
            .slide-rail {
                mix-blend-mode: normal;
            }

            .hint {
                animation: none;
            }

            .slide-media {
                inset: 0;
                height: 100%;
                will-change: auto;
                backface-visibility: visible;
                transform: none;
            }

            .slide-caption {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            }

            .slide-index { padding-top: 0; font-size: 0.8rem; }

            .slide-title {
                font-size: clamp(1.55rem, 7vw, 2.35rem);
            }

            .slide-sub {
                letter-spacing: 0.1em;
                line-height: 1.35;
            }

            /* Prefer the left side of wide landscape clips on tall phones */
            .slide-media.media-focus-left img,
            .slide-media.media-focus-left video {
                object-position: 18% center;
            }
        }

        @media (max-width: 480px) {
            :root { --hint-clearance: 4.75rem; }

            .top-bar {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .slide-caption {
                left: 1rem;
                right: 1rem;
                max-width: none;
            }

            .hint {
                letter-spacing: 0.16em;
            }

            .hint-full { display: none; }
            .hint-short { display: inline; }

            .slide-rail { gap: 0.55rem; right: 0.7rem; }
            .rail-tick { width: 0.5rem; }
            .rail-tick.is-active { width: 1.1rem; }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            :root { --hint-clearance: 3.5rem; }

            .slide-rail { display: none; }

            .slide-caption {
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            }

            .slide-title { font-size: clamp(1.25rem, 4vh, 1.85rem); }
            .slide-sub { display: none; }
            .hint { font-size: 0.65rem; }
        }
    </style>
</head>
<body class="is-arriving">
    <header class="top-bar">
        <a class="brand-mark" href="mosaic.html" data-enter>
            <span class="name">Jacob Nadal</span>
            <span class="tagline">The Traversal</span>
        </a>
        <a class="enter-link" href="mosaic.html" data-enter>Enter <span class="arrow">→</span></a>
    </header>

    <main class="slides" id="slides" aria-label="Featured photography and films"></main>

    <nav class="slide-rail" id="slideRail" aria-label="Jump to slide"></nav>

    <div class="hint">
        <span class="hint-full">Scroll — Click to enter</span>
        <span class="hint-short">Scroll · Enter</span>
    </div>
    <div class="enter-veil active" id="enterVeil">
        <span class="enter-veil-text">The Traversal</span>
    </div>

    <!-- Unveil failsafe: runs even if Lenis fails to load. -->
    <script>
        (function () {
            function clearArriveVeil() {
                if (window.__landingNavigating) return;
                document.body.classList.remove('is-arriving');
                var veil = document.getElementById('enterVeil');
                if (!veil) return;
                veil.classList.add('is-fading');
                veil.classList.remove('active');
            }
            // Absolute last resort so local hosting never sticks on the loader.
            setTimeout(clearArriveVeil, 1600);
            window.__clearArriveVeil = clearArriveVeil;
        })();
    </script>
    <script src="vendor/lenis.min.js"></script>
    <script>
        // Landing slides — edit this list to change the infinite loop.
        // type: 'image' | 'video'.  sub is optional (leave '' to hide).
        // Video slides name a clip; pickMedia() resolves it to the landscape or
        // portrait encode plus the matching poster.
        const ASSET_V = '?v=20260806';
        const LANDING_SLIDES = [
            { type: 'video', clip: '05_Icefileds_1',                      title: 'Icefields Parkway', sub: 'Banff National Park' },
            { type: 'image', src: 'IMAGES/01.jpg',                        title: 'Takakkaw Falls', sub: 'Yoho National Park' },
            { type: 'image', src: 'IMAGES/new/cass-and-aiden.jpg',       title: 'Back to Me',      sub: 'Dirty Aesthetic · Cover Art' },
            { type: 'image', src: 'IMAGES/03.jpg',                        title: 'King\u2019s Peak', sub: 'Strathcona Provincial Park' },
            { type: 'video', clip: '03_Fire_lookout_1',                   title: 'Hidden Lake Lookout', sub: 'North Cascades' },
            { type: 'image', src: 'IMAGES/new/man-under-snowy-mountain.jpg', title: 'Whistler',    sub: 'Avalanche Safety Training' },
            { type: 'video', clip: '02_SAS_1',                             title: 'Saskatchewan', sub: 'Windmill', focus: 'left' },
            { type: 'image', src: 'IMAGES/06.jpg',                        title: 'Kokanee Glacier', sub: 'Provincial Park' },
        ];

        const MOSAIC_URL = 'mosaic.html';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isTouch =
            window.matchMedia('(pointer: coarse)').matches ||
            (navigator.maxTouchPoints || 0) > 0;
        // Live, not a snapshot: a phone rotating to landscape crosses this exact
        // breakpoint, and leaving the portrait encode in a landscape viewport
        // would crop it far harder than the landscape encode ever was.
        const mobileLayoutMQ = window.matchMedia('(max-width: 768px)');
        let isMobileLayout = mobileLayoutMQ.matches;
        // Dirty Aesthetic's smooth touch behavior comes from leaving iOS on
        // native scrolling (Lenis syncTouch is disabled there). Do the same:
        // Safari gets a finite snap list, while desktop keeps the smooth loop.
        const useNativeScroll = reduceMotion || isTouch || isMobileLayout;
        const useInfiniteLoop = !useNativeScroll;

        // A 16:9 clip in a portrait phone viewport gets cropped to a narrow strip
        // by object-fit: cover and then upscaled ~2.3x — that upscale, not the
        // codec, is why the loops read as soft on a phone. The portrait encodes
        // are pre-cropped to the same framing at native resolution.
        // Keyed off layout width alone so it matches the <link media> preloads.
        function pickMedia(item) {
            if (item.type !== 'video') return { src: item.src, poster: item.poster };
            const portrait = isMobileLayout;
            return {
                src: (portrait ? 'CLIPS/mobile/' : 'CLIPS/') + item.clip + '.mp4' + ASSET_V,
                poster: 'IMAGES/video-posters/' + item.clip + (portrait ? '-m' : '') + '.jpg' + ASSET_V,
            };
        }

        // Always start from the first real slide on (re)load.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        // ---------- Build slides ----------
        // Desktop keeps three complete runs for its document-scroll loop.
        // Touch/mobile builds one finite run so Safari never has to remap or
        // transform the page during momentum.
        const slidesEl = document.getElementById('slides');
        const frag = document.createDocumentFragment();
        // Don't name this `N` — Lenis's minified bundle declares a global `N`.
        const SLIDE_COUNT = LANDING_SLIDES.length;
        const LOOP_COPIES = useInfiniteLoop ? 3 : 1;
        const MIDDLE_COPY = useInfiniteLoop ? 1 : 0;
        const IDX_FIRST_REAL = SLIDE_COUNT * MIDDLE_COPY;

        function createSlide(item, displayIndex, opts = {}) {
            const slide = document.createElement('section');
            slide.className = 'slide';
            const copyIndex = opts.copy ?? MIDDLE_COPY;
            slide.dataset.copy = String(copyIndex);
            slide.dataset.slideIndex = String(displayIndex);
            if (copyIndex !== MIDDLE_COPY) slide.setAttribute('aria-hidden', 'true');

            const media = document.createElement('div');
            media.className = 'slide-media';
            if (item.focus === 'left') media.classList.add('media-focus-left');
            // Portrait encodes are already cropped to this framing, so the CSS
            // nudge would double-apply it.
            if (item.type === 'video' && isMobileLayout) media.classList.add('media-precropped');

            const resolved = pickMedia(item);

            if (item.type === 'video') {
                const v = document.createElement('video');
                // Not once-only: swapping to the other encode drops this class so
                // the poster covers the reload, and it has to be re-earned.
                const markVideoFrameReady = () => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => slide.classList.add('video-frame-ready'));
                    });
                };
                v.muted = true;
                v.defaultMuted = true;
                v.loop = true;
                v.autoplay = Boolean(opts.priority) && !reduceMotion;
                v.controls = false;
                v.setAttribute('aria-hidden', 'true');
                v.setAttribute('muted', '');
                v.setAttribute('loop', '');
                v.setAttribute('playsinline', '');
                v.setAttribute('webkit-playsinline', '');
                v.playsInline = true;
                if (opts.priority && !reduceMotion) v.setAttribute('autoplay', '');
                v.setAttribute('preload', opts.priority ? 'auto' : 'none');
                v.setAttribute('disablepictureinpicture', '');
                if (resolved.poster) v.poster = resolved.poster;
                // Do not uncover Safari's native video surface until playback
                // actually begins; a loaded-but-blocked video shows a play icon.
                v.addEventListener('playing', markVideoFrameReady);

                // Only the opening slide loads eagerly. The duplicate copies used
                // to preload metadata too, on the theory that the loop seam could
                // land on one — but the seam is fixed at 2.5 slides either side of
                // the run boundary, which lands on image slides both ways, so the
                // observer below can attach them like any other clip.
                if (opts.priority) {
                    v.src = resolved.src;
                } else {
                    v.dataset.src = resolved.src;
                }
                media.appendChild(v);
                if (resolved.poster) {
                    const poster = document.createElement('img');
                    poster.className = 'video-poster';
                    poster.src = resolved.poster;
                    poster.alt = '';
                    poster.setAttribute('aria-hidden', 'true');
                    poster.loading = opts.priority ? 'eager' : 'lazy';
                    poster.decoding = 'async';
                    if (opts.priority) poster.fetchPriority = 'high';
                    media.appendChild(poster);
                }
            } else {
                const img = document.createElement('img');
                img.src = resolved.src;
                img.alt = item.title;
                img.loading = opts.priority || opts.nearby ? 'eager' : 'lazy';
                img.decoding = 'async';
                if (opts.priority) img.fetchPriority = 'high';
                media.appendChild(img);
            }

            const caption = document.createElement('div');
            caption.className = 'slide-caption';
            const idx = String(displayIndex + 1).padStart(2, '0');
            caption.innerHTML =
                '<span class="slide-index">' + idx + '</span>' +
                '<span class="slide-title-wrap">' +
                    '<span class="slide-title">' + item.title + '</span>' +
                    (item.sub ? '<span class="slide-sub">' + item.sub + '</span>' : '') +
                '</span>';

            slide.appendChild(media);
            slide.appendChild(caption);
            return slide;
        }

        for (let copy = 0; copy < LOOP_COPIES; copy++) {
            LANDING_SLIDES.forEach((item, i) => {
                const isOpeningSlide = copy === MIDDLE_COPY && i === 0;
                const isOpeningNeighbor = copy === MIDDLE_COPY && i === 1;
                frag.appendChild(createSlide(item, i, {
                    copy,
                    priority: isOpeningSlide,

        let SLIDE_H = 1;
        function measureSlideHeight() {

            touchActive = false;
            scheduleNativeRecenter();
        }, { passive: true });

        // Recenter between identical runs while there is still a full viewport of
        // runway in either direction. The visible pixels do not change.
        function currentScroll() {

        }

        function scrollImmediately(y) {

        function syncMatchingLoopVideo(fromY, toY, h) {
            const source = videoByIndex.get(Math.round(fromY / h));

            if (!useInfiniteLoop || !loopReady || wrapping || isSnapping || touchActive) return;
            const h = slideHeight();
            if (h < 80) return;
            const y = currentScroll();
            const runHeight = SLIDE_COUNT * h;
            // Stay in the identical outer run for a few slides before remapping.
            // This keeps the jump away from the opening-video/Kokanee boundary,
            // where iOS momentum and video painting can otherwise fight snapping.
            const upperRecenterPoint = (SLIDE_COUNT - 2.5) * h;
            const lowerRecenterPoint = (SLIDE_COUNT * 2 + 2.5) * h;

            // Entering the first run: move to the same pixels one run lower.
            if (y < upperRecenterPoint) {
                const next = y + runHeight;
                wrapping = true;
                syncMatchingLoopVideo(y, next, h);
                scrollImmediately(next);
                lastScroll = next;
                wrapping = false;
                resetParallax();
                return;
            }
            // Entering the third run: move to the same pixels one run higher.
            if (y > lowerRecenterPoint) {
                const next = y - runHeight;
                wrapping = true;
                syncMatchingLoopVideo(y, next, h);
                scrollImmediately(next);
                lastScroll = next;
                wrapping = false;
                resetParallax();
            }

        function scheduleNativeRecenter(delay = 180) {
            if (!useNativeScroll || !useInfiniteLoop) return;
            clearTimeout(nativeRecenterTimer);

                normalizeLoop();
                syncLandingVideos();
            }, delay);
        }

        // Always snap to the nearby physical slide. normalizeLoop() recenters
        // afterward, avoiding an animated trip through a whole eight-slide run.
        function realSnapIndex(i) {
            return Math.max(0, Math.min(slideEls.length - 1, i));
        }

        window.addEventListener('orientationchange', () => {
            // Capture which slide we were on *before* re-measuring, so the new
            // height doesn't move us to a different photograph.
            const nearestIndex = Math.round(currentScroll() / SLIDE_H);
            setTimeout(() => {
                measureSlideHeight();
                if (lenis) lenis.resize();
                const targetY = scrollForIndex(realSnapIndex(nearestIndex));
                scrollImmediately(targetY);
                lastScroll = targetY;
                resetParallax();
                syncLandingVideos();
                updateActiveSlide();
            }, 220);
        }, { passive: true });

        // ---------- Parallax ----------
        // Writes only. Slide i's offset from the viewport top is (i - scroll/H)
        // viewports, so nothing here needs to ask the layout engine anything.
        const PARALLAX_AMOUNT = isTouch ? -3.2 : -5.5;
        const lastShift = new Array(slideEls.length).fill(null);
        let pFirst = 0, pLast = -1;

            if (media) media.style.transform = 'translate3d(0,' + shift + '%,0)';

            for (let i = 0; i < slideEls.length; i++) setMediaShift(i, 0);

            pLast = -1;

            if (wrapping) {

                return;

            const base = currentScroll() / SLIDE_H;
            // Only the slide under the viewport and its immediate neighbours can
            // be visible, so at most four elements are ever touched per frame.
            const first = Math.max(0, Math.floor(base) - 1);
            const last = Math.min(slideEls.length - 1, Math.floor(base) + 2);
            for (let i = pFirst; i <= pLast; i++) {
                if (i < first || i > last) setMediaShift(i, 0);
            }
            for (let i = first; i <= last; i++) {

                setMediaShift(i, +(progress * PARALLAX_AMOUNT).toFixed(2));

            pLast = last;
        }

        // ---------- Active slide ----------
        // Drives the caption reveal and the progress rail. Only fires on change,
        // so it costs two class writes per slide rather than anything per frame.
        let activeIndex = -1;
        const railTicks = [];

        function displayIndexOf(physicalIndex) {
            return ((physicalIndex % SLIDE_COUNT) + SLIDE_COUNT) % SLIDE_COUNT;
        }

            if (video.dataset.parked === '1') return;

            };

                return;

            if (!video.paused) return;

            if (playPromise && playPromise.catch) playPromise.catch(() => {});

        // Derives the desired play state from scroll position alone and reconciles

        // scrollTo, a tab switch — stayed paused until the range moved again.

        // play() and pause() are guarded on the element's current state, so a
        // steady-state frame is nine boolean reads and nothing else.
        function syncLandingVideos() {
            if (document.hidden || navigating) {
                landingVideos.forEach(video => { if (!video.paused) video.pause(); });
                return;
            }
            const base = currentScroll() / SLIDE_H;
            const first = Math.max(0, Math.floor(base));
            const last = Math.min(slideEls.length - 1, Math.ceil(base + 0.88) - 1);

                else if (!video.paused) video.pause();

                entries.forEach(entry => {

            const landingPlaybackObserver = new IntersectionObserver(syncLandingVideos, {

                threshold: [0, 0.12],
            });

                landingPreloadObserver.observe(video);
                landingPlaybackObserver.observe(video);
            });

            landingVideos.forEach(attachLandingVideo);
            window.addEventListener('scroll', syncLandingVideos, { passive: true });
        }

        document.addEventListener('visibilitychange', syncLandingVideos);
        window.addEventListener('pageshow', syncLandingVideos);

        // Re-point every clip at the encode that matches the current layout.
        // Only the media is swapped, never the scroll mode — rebuilding the loop
        // mid-session would undo the seating and the Safari-specific handling.
        function swapVideoVariants() {
            slideEls.forEach((slide, i) => {
                const item = LANDING_SLIDES[Number(slide.dataset.slideIndex)];
                if (!item || item.type !== 'video') return;
                const video = videoByIndex.get(i);
                if (!video) return;

                const next = pickMedia(item);
                const media = slide.firstElementChild;
                if (media) media.classList.toggle('media-precropped', isMobileLayout);

                const posterImg = slide.querySelector('.video-poster');
                if (posterImg) posterImg.src = next.poster;
                video.poster = next.poster;

                if (!video.src) {
                    // Never attached — just retarget the lazy source.
                    video.dataset.src = next.src;
                    return;
                }
                if (video.src.endsWith(next.src)) return;

                const resumeAt = video.currentTime;
                const wasPlaying = !video.paused;
                // Drop back to the poster so the reload doesn't flash black.
                slide.classList.remove('video-frame-ready');
                video.src = next.src;
                video.addEventListener('loadedmetadata', () => {
                    try { video.currentTime = resumeAt % (video.duration || 1); } catch (_) {}
                    if (wasPlaying) playLandingVideo(video);
                }, { once: true });
                try { video.load(); } catch (_) {}
            });
            // The rAF loop reconciles playback on desktop, but the native-scroll
            // path is event-driven — without this a swap with no scroll after it
            // would leave the on-screen clip parked.
            syncLandingVideos();
        }

        const onLayoutBreakpointChange = (e) => {
            isMobileLayout = e.matches;
            swapVideoVariants();
        };
        if (mobileLayoutMQ.addEventListener) mobileLayoutMQ.addEventListener('change', onLayoutBreakpointChange);
        else if (mobileLayoutMQ.addListener) mobileLayoutMQ.addListener(onLayoutBreakpointChange);

        // The breakpoint can also be wrong on arrival: some browsers finish
        // establishing the viewport after this script parses, so matchMedia can
        // report the pre-layout width. Reconcile once the first frame is real.
        requestAnimationFrame(() => {
            if (mobileLayoutMQ.matches === isMobileLayout) return;
            isMobileLayout = mobileLayoutMQ.matches;
            swapVideoVariants();
        });

        // Arrive under the branded veil, then fade it once the opening clip
        // has a real frame — no stacked long waits (those felt "extra long").
        (function arriveFromVeil() {
            const started = performance.now();
            const fromMosaic = (() => {
                try { return sessionStorage.getItem('traversal-handoff') === '1'; }
                catch (_) { return false; }
            })();
            try { sessionStorage.removeItem('traversal-handoff'); } catch (_) {}

            const MAX_MS = 1400;
            let revealed = false;

            function reveal() {
                if (revealed) return;
                revealed = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => revealLanding(true));
                });
            }

            function tryReveal() {
                const wait = Math.max(0, MIN_MS - (performance.now() - started));
                setTimeout(reveal, wait);
            }

            const firstVideo = slideEls[IDX_FIRST_REAL]?.querySelector('video');
            if (firstVideo) {

                    playLandingVideo(firstVideo);
                    tryReveal();

                try { firstVideo.load(); } catch (_) {}

                    firstVideo.addEventListener('loadeddata', ready, { once: true });
                    firstVideo.addEventListener('canplay', ready, { once: true });
                    firstVideo.addEventListener('error', ready, { once: true });
                }
            } else {
                const firstImg = document.querySelector('.slide-media img');
                if (firstImg && firstImg.complete) tryReveal();
                else if (firstImg) {
                    firstImg.addEventListener('load', tryReveal, { once: true });
                    firstImg.addEventListener('error', tryReveal, { once: true });
                } else tryReveal();
            }
            setTimeout(reveal, MAX_MS);
        })();

        // iOS/Android back often restores this page from bfcache with the enter
        // veil still up and navigating=true — that froze the loader forever.
        window.addEventListener('pageshow', (e) => {
            // First visit: let arriveFromVeil own the reveal.
            // Back/forward restore: force the page awake again.
            if (!e.persisted && !navigating) return;

            navigating = false;
            isSnapping = false;
            touchActive = false;
            revealLanding(true);
            if (!lenis) ensureLenis();
            if (lenis) {
                try { lenis.start(); } catch (_) {}
                try { lenis.resize(); } catch (_) {}
                try {
                    lenis.scrollTo(scrollForIndex(IDX_FIRST_REAL), { immediate: true, force: true });
                } catch (_) {}
            } else {
                scrollImmediately(scrollForIndex(IDX_FIRST_REAL));
            }
            lastScroll = scrollForIndex(IDX_FIRST_REAL);
        });
    </script>
</body>
</html>
