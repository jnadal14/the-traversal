<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jacob Nadal — The Traversal</title>
    <link rel="icon" type="image/jpeg" href="FAVICON.jpg">
    <link rel="apple-touch-icon" href="FAVICON.jpg">
    <!-- Preload first-screen media + warm the mosaic so enter feels instant -->
    <link rel="preload" href="CLIPS/05_Icefileds_1.mp4" as="video" type="video/mp4">
    <link rel="preload" href="IMAGES/01.jpg" as="image">
    <link rel="prefetch" href="mosaic.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Darker+Grotesque:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f5f5f0;
            --muted: rgba(245, 245, 240, 0.6);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Darker Grotesque', sans-serif;
            --hint-clearance: 4.5rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            /* Infinite loop remaps scroll — hide the bar so it never jumps */
            scrollbar-width: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Recommended Lenis styles */
        html.lenis, html.lenis body { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }

        a { color: inherit; text-decoration: none; }

        /* ---------- Slides ---------- */
        .slides { width: 100%; }

        .slide {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            overflow: clip;
            contain: paint;
            cursor: pointer;
            background: #050505;
        }

        .slide-media {
            position: absolute;
            /* Smaller overscan = less bleed at the infinite-scroll wrap */
            inset: -8% 0;
            height: 116%;
            will-change: transform;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .slide-media img,
        .slide-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            background: #050505;
        }

        .slide-media.media-focus-left img,
        .slide-media.media-focus-left video {
            object-position: left center;
        }

        /* Subtle vignette so captions stay legible */
        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 35%),
                        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%);
        }

        .slide-caption {
            position: absolute;
            left: clamp(1.25rem, 5vw, 4rem);
            right: clamp(1.25rem, 5vw, 4rem);
            bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 1.25rem;
            max-width: min(42rem, 100%);
            text-shadow: 0 1px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .slide-index {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--muted);
            padding-top: 0.6rem;
            flex-shrink: 0;
        }

        .slide-title-wrap { display: flex; flex-direction: column; min-width: 0; }

        .slide-title {
            font-family: var(--font-display);
            font-size: clamp(1.65rem, 4.8vw, 3.75rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0.01em;
        }

        .slide-sub {
            font-family: var(--font-body);
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.4rem;
        }

        /* ---------- Fixed UI ---------- */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: clamp(1rem, 3vw, 2rem) clamp(1.25rem, 5vw, 4rem);
            padding-top: max(clamp(1rem, 3vw, 2rem), env(safe-area-inset-top));
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .brand-mark { pointer-events: auto; min-width: 0; }

        .brand-mark .name {
            font-family: var(--font-display);
            font-size: clamp(1.15rem, 3.5vw, 1.35rem);
            font-weight: 500;
            display: block;
            line-height: 1.1;
        }

        .brand-mark .tagline {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .enter-link {
            pointer-events: auto;
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            transition: opacity 0.3s ease;
        }

        .enter-link .arrow { transition: transform 0.3s ease; }
        .enter-link:hover .arrow { transform: translateX(4px); }

        /* Scroll / enter hint — always sits below captions */
        .hint {
            position: fixed;
            bottom: max(1rem, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: max-content;
            max-width: calc(100vw - 2rem);
            padding: 0 0.5rem;
            font-size: clamp(0.65rem, 2.4vw, 0.78rem);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            mix-blend-mode: difference;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            pointer-events: none;
            animation: floaty 2.6s ease-in-out infinite;
            white-space: nowrap;
        }

        .hint-full { display: inline; }
        .hint-short { display: none; }

        @keyframes floaty {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.75; }
            50% { transform: translate(-50%, 5px); opacity: 1; }
        }

        /* ---------- Enter / arrive veil ---------- */
        .enter-veil {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-veil.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        /* First paint: solid cover, no fade-in flash. Fade only on leave. */
        body.is-arriving .enter-veil.active {
            transition: none;
        }
        .enter-veil.is-fading {
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s;
        }

        .enter-veil-text {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(245, 245, 240, 0.85);
            opacity: 0.55;
            animation: veilPulse 1.6s ease-in-out infinite;
        }

        @keyframes veilPulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }

        body.is-arriving .top-bar,
        body.is-arriving .hint {
            opacity: 0;
        }

        body:not(.is-arriving) .top-bar,
        body:not(.is-arriving) .hint {
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
        }

        @media (prefers-reduced-motion: reduce) {
            .hint, .enter-veil-text { animation: none; }
            .slide-media { inset: 0; height: 100%; will-change: auto; }
            .enter-veil, .enter-veil.is-fading { transition: none !important; }
            html { scroll-snap-type: y proximity; }
            .slide { scroll-snap-align: start; }
        }

        @media (max-width: 768px) {
            :root { --hint-clearance: 5.25rem; }

            .brand-mark .tagline { display: none; }

            .slide-caption {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            }

            .slide-index { padding-top: 0; font-size: 0.8rem; }

            .slide-title {
                font-size: clamp(1.55rem, 7vw, 2.35rem);
            }

            .slide-sub {
                letter-spacing: 0.1em;
                line-height: 1.35;
            }

            /* Prefer the left side of wide landscape clips on tall phones */
            .slide-media.media-focus-left img,
            .slide-media.media-focus-left video {
                object-position: 18% center;
            }
        }

        @media (max-width: 480px) {
            :root { --hint-clearance: 4.75rem; }

            .top-bar {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .slide-caption {
                left: 1rem;
                right: 1rem;
                max-width: none;
            }

            .hint {
                letter-spacing: 0.16em;
            }

            .hint-full { display: none; }
            .hint-short { display: inline; }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            :root { --hint-clearance: 3.5rem; }

            .slide-caption {
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px));
            }

            .slide-title { font-size: clamp(1.25rem, 4vh, 1.85rem); }
            .slide-sub { display: none; }
            .hint { font-size: 0.65rem; }
        }
    </style>
</head>
<body class="is-arriving">
    <header class="top-bar">
        <a class="brand-mark" href="mosaic.html" data-enter>
            <span class="name">Jacob Nadal</span>
            <span class="tagline">The Traversal</span>
        </a>
        <a class="enter-link" href="mosaic.html" data-enter>Enter <span class="arrow">→</span></a>
    </header>

    <main class="slides" id="slides"></main>

    <div class="hint">
        <span class="hint-full">Scroll — Click to enter</span>
        <span class="hint-short">Scroll · Enter</span>
    </div>
    <div class="enter-veil active" id="enterVeil">
        <span class="enter-veil-text">The Traversal</span>
    </div>

    <!-- Unveil failsafe: runs even if Lenis fails to load. -->
    <script>
        (function () {
            function clearArriveVeil() {
                if (window.__landingNavigating) return;
                document.body.classList.remove('is-arriving');
                var veil = document.getElementById('enterVeil');
                if (!veil) return;
                veil.classList.add('is-fading');
                veil.classList.remove('active');
            }
            // Absolute last resort so local hosting never sticks on the loader.
            setTimeout(clearArriveVeil, 1600);
            window.__clearArriveVeil = clearArriveVeil;
        })();
    </script>
    <script src="vendor/lenis.min.js"></script>
    <script>
        // Landing slides — edit this list to change the infinite loop.
        // type: 'image' | 'video'.  sub is optional (leave '' to hide).
        const LANDING_SLIDES = [
            { type: 'video', src: 'CLIPS/05_Icefileds_1.mp4',            title: 'The Icefields',   sub: 'Icefields Parkway · Banff National Park' },
            { type: 'image', src: 'IMAGES/01.jpg',                        title: ' Falls',  sub: 'Yoho National Park' },
            { type: 'image', src: 'IMAGES/new/cass-and-aiden.jpg',       title: 'Back to Me',      sub: 'Dirty Aesthetic · Cover Art' },
            { type: 'image', src: 'IMAGES/03.jpg',                        title: 'King\u2019s Peak', sub: 'Strathcona Provincial Park' },
            { type: 'video', src: 'CLIPS/03_Fire_lookout_1.mp4',         title: 'Hidden Lake Lookout', sub: 'North Cascades' },
            { type: 'image', src: 'IMAGES/new/man-under-snowy-mountain.jpg', title: 'Whistler',    sub: 'Avalanche Safety Training' },
            { type: 'video', src: 'CLIPS/02_SAS_1.mp4',                 title: 'Saskatchewan',    sub: 'Windmill', focus: 'left' },
            { type: 'image', src: 'IMAGES/06.jpg',                        title: 'Kokanee Glacier', sub: 'Provincial Park' },
        ];

        const MOSAIC_URL = 'mosaic.html';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Always start from the first real slide on (re)load.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        // ---------- Build slides ----------
        // Seamless loop without Lenis infinite (that was breaking up-scroll
        // after wrapping to 01, and snapping at the ends):
        //   [clone of LAST] + [real slides] + [clone of FIRST]
        // Start on the first real slide. When you enter a clone zone, silently
        // jump to the matching real slide — always room to scroll both ways.
        const slidesEl = document.getElementById('slides');
        const frag = document.createDocumentFragment();
        // Don't name this `N` — Lenis's minified bundle declares a global `N`.
        const SLIDE_COUNT = LANDING_SLIDES.length;
        const IDX_LAST_CLONE = 0;
        const IDX_FIRST_REAL = 1;
        const IDX_LAST_REAL = SLIDE_COUNT;
        const IDX_FIRST_CLONE = SLIDE_COUNT + 1;

        function createSlide(item, displayIndex, opts) {
            const slide = document.createElement('section');
            slide.className = 'slide';
            if (opts && opts.clone) slide.dataset.clone = opts.clone;
            slide.dataset.slideIndex = String(displayIndex);

            const media = document.createElement('div');
            media.className = 'slide-media';
            if (item.focus === 'left') media.classList.add('media-focus-left');

            if (item.type === 'video') {
                const v = document.createElement('video');
                v.src = item.src;
                v.muted = true;
                v.loop = true;
                v.autoplay = true;
                v.setAttribute('playsinline', '');
                v.setAttribute('preload', displayIndex === 0 ? 'auto' : 'metadata');
                media.appendChild(v);
            } else {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.title;
                img.loading = displayIndex < 2 ? 'eager' : 'lazy';
                img.decoding = 'async';
                media.appendChild(img);
            }

            const caption = document.createElement('div');
            caption.className = 'slide-caption';
            const idx = String(displayIndex + 1).padStart(2, '0');
            caption.innerHTML =
                '<span class="slide-index">' + idx + '</span>' +
                '<span class="slide-title-wrap">' +
                    '<span class="slide-title">' + item.title + '</span>' +
                    (item.sub ? '<span class="slide-sub">' + item.sub + '</span>' : '') +
                '</span>';

            slide.appendChild(media);
            slide.appendChild(caption);
            return slide;
        }

        frag.appendChild(createSlide(LANDING_SLIDES[SLIDE_COUNT - 1], SLIDE_COUNT - 1, { clone: 'last' }));
        LANDING_SLIDES.forEach((item, i) => {
            frag.appendChild(createSlide(item, i));
        });
        frag.appendChild(createSlide(LANDING_SLIDES[0], 0, { clone: 'first' }));

        slidesEl.appendChild(frag);
        const slideEls = Array.from(document.querySelectorAll('.slide'));

        let lenis = null;

        // ---------- Enter navigation ----------
        let navigating = false;

        function revealLanding(force) {
            if (!force && navigating) return;
            navigating = false;
            window.__landingNavigating = false;
            if (typeof window.__clearArriveVeil === 'function') {
                window.__clearArriveVeil();
            } else {
                document.body.classList.remove('is-arriving');
                const veilEl = document.getElementById('enterVeil');
                if (veilEl) {
                    veilEl.classList.add('is-fading');
                    veilEl.classList.remove('active');
                }
            }
            document.querySelectorAll('.slide-media video').forEach(v => {
                v.muted = true;
                v.play().catch(() => {});
            });
            if (lenis) {
                try { lenis.start(); } catch (_) {}
                try { lenis.resize(); } catch (_) {}
            }
        }

        function enterSite() {
            if (navigating) return;
            navigating = true;
            window.__landingNavigating = true;
            if (lenis) {
                try { lenis.stop(); } catch (_) {}
            }
            document.documentElement.classList.remove('lenis', 'lenis-smooth');
            const v = document.getElementById('enterVeil');
            if (v) {
                v.classList.remove('is-fading');
                v.classList.add('active');
            }
            setTimeout(() => { window.location.href = MOSAIC_URL; }, 420);
        }

        document.querySelectorAll('[data-enter]').forEach(el => {
            el.addEventListener('click', (e) => { e.preventDefault(); enterSite(); });
        });

        let downX = 0, downY = 0, moved = false;
        slidesEl.addEventListener('pointerdown', (e) => {
            downX = e.clientX; downY = e.clientY; moved = false;
        });
        slidesEl.addEventListener('pointermove', (e) => {
            if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) moved = true;
        });
        slidesEl.addEventListener('click', () => { if (!moved) enterSite(); });

        // ---------- Lenis smooth scroll (manual seamless loop) ----------
        const isTouch =
            window.matchMedia('(pointer: coarse)').matches ||
            (navigator.maxTouchPoints || 0) > 0;
        let lastScroll = 0;
        let wrapping = false;
        let isSnapping = false;
        let touchActive = false;
        let lastVelocity = 0;
        // Don't remap until the first real slide is seated — otherwise a 0-height
        // layout pass can clamp wraps forever and freeze the main thread.
        let loopReady = false;

        function slideHeight() {
            // Prefer measured slide height (handles mobile URL bar / svh)
            const h = slideEls[IDX_FIRST_REAL] && slideEls[IDX_FIRST_REAL].offsetHeight;
            return h || window.innerHeight || 1;
        }

        function scrollForIndex(i) {
            return i * slideHeight();
        }

        function ensureLenis() {
            if (reduceMotion || !window.Lenis) return;
            if (lenis) return;
            try {
                lenis = new Lenis(isTouch ? {
                    infinite: false,
                    syncTouch: true,
                    syncTouchLerp: 0.085,
                    touchInertiaMultiplier: 12,
                    touchMultiplier: 1.0,
                    wheelMultiplier: 0.85,
                    lerp: 0.12,
                    gestureOrientation: 'vertical',
                    smoothWheel: true,
                } : {
                    infinite: false,
                    lerp: 0.14,
                    wheelMultiplier: 0.85,
                    touchMultiplier: 1.0,
                    gestureOrientation: 'vertical',
                    syncTouch: true,
                    syncTouchLerp: 0.1,
                    touchInertiaMultiplier: 14,
                });
            } catch (_) {
                lenis = null;
            }
        }

        function seatAtFirstReal() {
            const y = scrollForIndex(IDX_FIRST_REAL);
            if (lenis) {
                try {
                    lenis.resize();
                    lenis.scrollTo(y, { immediate: true, force: true });
                } catch (_) {}
            } else {
                window.scrollTo(0, y);
            }
            lastScroll = y;
        }

        ensureLenis();
        seatAtFirstReal();
        requestAnimationFrame(() => {
            seatAtFirstReal();
            requestAnimationFrame(() => {
                seatAtFirstReal();
                loopReady = true;
            });
        });

        document.documentElement.style.touchAction = 'pan-y';
        document.body.style.touchAction = 'pan-y';
        slidesEl.style.touchAction = 'pan-y';

        window.addEventListener('touchstart', () => {
            touchActive = true;
            isSnapping = false;
        }, { passive: true });
        window.addEventListener('touchend', () => { touchActive = false; }, { passive: true });
        window.addEventListener('touchcancel', () => { touchActive = false; }, { passive: true });

        // Remap clone zones → real slides (keeps both scroll directions alive)
        function normalizeLoop() {
            if (!loopReady || !lenis || wrapping || isSnapping) return;
            const h = slideHeight();
            if (h < 80) return;
            const y = lenis.scroll;
            const limit = typeof lenis.limit === 'number' ? lenis.limit : Infinity;
            // Top buffer = clone of last → jump to real last
            if (y < h * 0.5) {
                const next = Math.min(y + SLIDE_COUNT * h, limit);
                if (next <= y + 1) return; // layout not ready / clamp would no-op
                wrapping = true;
                lenis.scrollTo(next, { immediate: true, force: true });
                lastScroll = next;
                wrapping = false;
                resetParallax();
                return;
            }
            // Bottom buffer = clone of first → jump to real first
            if (y > (SLIDE_COUNT + 0.5) * h) {
                const next = Math.max(0, y - SLIDE_COUNT * h);
                if (next >= y - 1) return;
                wrapping = true;
                lenis.scrollTo(next, { immediate: true, force: true });
                lastScroll = next;
                wrapping = false;
                resetParallax();
            }
        }

        // Map any index (including clones) to the real slide we should snap to
        function realSnapIndex(i) {
            if (i === IDX_LAST_CLONE) return IDX_LAST_REAL;
            if (i === IDX_FIRST_CLONE) return IDX_FIRST_REAL;
            return i;
        }

        // ---------- Parallax ----------
        function resetParallax() {
            for (const slide of slideEls) {
                const media = slide.firstElementChild;
                if (media) media.style.transform = 'translate3d(0,0,0)';
            }
        }

        function updateParallax() {
            if (wrapping) {
                resetParallax();
                return;
            }
            const vh = slideHeight();
            const amount = isTouch ? -3.2 : -5.5;
            for (const slide of slideEls) {
                const media = slide.firstElementChild;
                if (!media) continue;
                const rect = slide.getBoundingClientRect();
                if (rect.bottom <= 0 || rect.top >= vh) {
                    media.style.transform = 'translate3d(0,0,0)';
                    continue;
                }
                const progress = (rect.top + rect.height / 2 - vh / 2) / vh;
                const shift = Math.max(-1, Math.min(1, progress)) * amount;
                media.style.transform = 'translate3d(0,' + shift.toFixed(2) + '%,0)';
            }
        }

        function raf(time) {
            if (lenis) {
                lenis.raf(time);
                normalizeLoop();
            }
            updateParallax();
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
        if (!lenis) window.addEventListener('scroll', updateParallax, { passive: true });
        updateParallax();

        // ---------- Magnetic snap ----------
        if (lenis) {
            const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);
            let snapTimer = null;
            // Snap as soon as coasting slows — don't wait out a long inertia drift.
            const SNAP_DELAY = isTouch ? 28 : 36;
            const SNAP_DURATION = isTouch ? 0.42 : 0.48;
            const VEL_IDLE = isTouch ? 1.35 : 2.8;
            const SNAP_DEADZONE = isTouch ? 8 : 3;

            function nearestSlide() {
                let best = null, bestDist = Infinity, bestIndex = 0;
                slideEls.forEach((s, i) => {
                    const dist = Math.abs(s.getBoundingClientRect().top);
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = s;
                        bestIndex = i;
                    }
                });
                return { best, bestDist, bestIndex };
            }

            function snapToNearest() {
                if (navigating || isSnapping || wrapping || touchActive) return;
                if (Math.abs(lastVelocity) > VEL_IDLE) return;
                if (!lenis) return;

                normalizeLoop();

                const { bestDist, bestIndex } = nearestSlide();
                const targetIndex = realSnapIndex(bestIndex);
                const target = slideEls[targetIndex];
                if (!target) return;

                const dist = Math.abs(target.getBoundingClientRect().top);
                if (dist < SNAP_DEADZONE) return;

                isSnapping = true;
                lenis.scrollTo(target, {
                    duration: SNAP_DURATION,
                    easing: easeOutQuart,
                    lock: false,
                    onComplete: () => {
                        isSnapping = false;
                        normalizeLoop();
                    },
                });
            }

            function scheduleSnap() {
                clearTimeout(snapTimer);
                snapTimer = setTimeout(snapToNearest, SNAP_DELAY);
            }

            lenis.on('scroll', ({ scroll, velocity }) => {
                lastVelocity = velocity || 0;
                lastScroll = scroll;
                if (wrapping) return;
                normalizeLoop();

                if (isSnapping || wrapping || touchActive) {
                    clearTimeout(snapTimer);
                    return;
                }
                if (Math.abs(lastVelocity) > VEL_IDLE) {
                    clearTimeout(snapTimer);
                    return;
                }
                scheduleSnap();
            });

            window.addEventListener('touchend', () => {
                if (!isTouch) return;
                clearTimeout(snapTimer);
                snapTimer = setTimeout(() => {
                    if (Math.abs(lastVelocity) <= VEL_IDLE) snapToNearest();
                    else scheduleSnap();
                }, 40);
            }, { passive: true });

            ['wheel', 'touchstart', 'keydown'].forEach(evt => {
                window.addEventListener(evt, () => { clearTimeout(snapTimer); }, { passive: true });
            });
        }

        // ---------- Video playback (always playing, on- or off-screen) ----------
        const videos = Array.from(document.querySelectorAll('.slide-media video'));
        function keepPlaying(v) {
            const p = v.play();
            if (p && p.catch) p.catch(() => {});
        }
        videos.forEach(v => {
            v.muted = true;
            v.loop = true;
            v.setAttribute('playsinline', '');
            keepPlaying(v);
            v.addEventListener('loadeddata', () => keepPlaying(v));
            v.addEventListener('canplay', () => keepPlaying(v));
            // If anything pauses it (tab switch, iOS, etc.), resume immediately.
            v.addEventListener('pause', () => { if (!document.hidden) keepPlaying(v); });
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) videos.forEach(keepPlaying);
        });

        // Soft-preload the remaining landing videos in the background so
        // scrolling feels continuous without blocking first paint.
        requestAnimationFrame(() => {
            LANDING_SLIDES.forEach((item, i) => {
                if (item.type !== 'video' || i === 0) return;
                const link = document.createElement('link');
                link.rel = 'prefetch';
                link.as = 'video';
                link.href = item.src;
                document.head.appendChild(link);
            });
        });

        // Arrive under the branded veil, then fade it once the opening clip
        // has a real frame — no stacked long waits (those felt "extra long").
        (function arriveFromVeil() {
            const started = performance.now();
            const fromMosaic = (() => {
                try { return sessionStorage.getItem('traversal-handoff') === '1'; }
                catch (_) { return false; }
            })();
            try { sessionStorage.removeItem('traversal-handoff'); } catch (_) {}

            const MIN_MS = fromMosaic ? 280 : 320;
            const MAX_MS = 1400;
            let revealed = false;

            function reveal() {
                if (revealed) return;
                revealed = true;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => revealLanding(true));
                });
            }

            function tryReveal() {
                const wait = Math.max(0, MIN_MS - (performance.now() - started));
                setTimeout(reveal, wait);
            }

            const firstVideo = document.querySelector('.slide-media video');
            if (firstVideo) {
                const ready = () => {
                    firstVideo.play().catch(() => {});
                    tryReveal();
                };
                if (firstVideo.readyState >= 2) ready();
                else {
                    firstVideo.addEventListener('loadeddata', ready, { once: true });
                    firstVideo.addEventListener('canplay', ready, { once: true });
                    firstVideo.addEventListener('error', ready, { once: true });
                }
            } else {
                const firstImg = document.querySelector('.slide-media img');
                if (firstImg && firstImg.complete) tryReveal();
                else if (firstImg) {
                    firstImg.addEventListener('load', tryReveal, { once: true });
                    firstImg.addEventListener('error', tryReveal, { once: true });
                } else tryReveal();
            }
            setTimeout(reveal, MAX_MS);
        })();

        // iOS/Android back often restores this page from bfcache with the enter
        // veil still up and navigating=true — that froze the loader forever.
        window.addEventListener('pageshow', (e) => {
            // First visit: let arriveFromVeil own the reveal.
            // Back/forward restore: force the page awake again.
            if (!e.persisted && !navigating) return;

            navigating = false;
            isSnapping = false;
            touchActive = false;
            revealLanding(true);
            if (!lenis) ensureLenis();
            if (lenis) {
                try { lenis.start(); } catch (_) {}
                try { lenis.resize(); } catch (_) {}
                try {
                    lenis.scrollTo(scrollForIndex(IDX_FIRST_REAL), { immediate: true, force: true });
                } catch (_) {}
                lastScroll = scrollForIndex(IDX_FIRST_REAL);
            }
        });
    </script>
</body>
</html>
