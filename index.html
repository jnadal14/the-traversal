<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jacob Nadal — The Traversal</title>
    <link rel="icon" type="image/jpeg" href="assets/site/favicon.jpg">
    <link rel="apple-touch-icon" href="assets/site/favicon.jpg">
    <!-- Preload first-screen media + warm the mosaic so enter feels instant.
         Desktop pulls the 1080p landscape encode, phones the portrait crop, so
         neither downloads pixels the other will never show. Each poster is
         frame 0 of its own encode, which makes the poster->video swap invisible. -->
    <link rel="preload" href="assets/posters/icefields-1.jpg?v=20260827" as="image" fetchpriority="high" media="(min-width: 769px)">
    <link rel="preload" href="assets/posters/icefields-1-m.jpg?v=20260827" as="image" fetchpriority="high" media="(max-width: 768px)">
    <!-- The two `as="video"` preloads that used to sit here did nothing. Measured
         on the deployed site: the hero clip's Resource Timing initiator is
         "video", not "link" — the preload never served the request, so the fetch
         still only began once the script built the element. as="video" is not a
         reliable preload target (Safari does not implement it at all), and a
         preload the element never claims is pure competition for the connection.
         The poster links above DO work — initiator "link" — and the poster is
         what covers the slide until a frame is drawable, so that is the one that
         actually shortens the wait.
         mosaic.html's prefetch also moved: it was starting BEFORE the hero clip.
         It now runs from the load event, below, where an idle prefetch belongs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Darker+Grotesque:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f5f5f0;
            --muted: rgba(245, 245, 240, 0.6);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Darker Grotesque', sans-serif;
            --hint-clearance: 4.5rem;
            /* How much of a slide's bottom edge the browser chrome is currently
               covering: zero once the address bar has retracted, its height
               while it is on screen. Slides are sized in lvh so the bar cannot
               move them; this is what keeps the caption above the bar instead,
               and it moves one small element rather than all 24 slides.
               Falls back to 0 anywhere without dvh/lvh. */
            --chrome-bottom: 0px;
            --chrome-bottom: calc(100lvh - 100dvh);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        a:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
            -webkit-overflow-scrolling: touch;
            /* Infinite loop remaps scroll — hide the bar so it never jumps */
            scrollbar-width: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Touch devices keep scrolling on Safari's compositor, matching the
           native-touch path used by the Dirty Aesthetic site. */
        html.native-snap {
            scroll-behavior: auto;
            scroll-snap-type: y mandatory;
        }
        html.native-snap .slide {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        a { color: inherit; text-decoration: none; }

        /* ---------- Slides ---------- */
        .slides { width: 100%; }

        .slide {
            position: relative;
            width: 100%;
            /* lvh, NOT dvh. This was dvh, to keep the caption clear of the iOS
               address bar — but dvh re-resolves as that bar retracts, and with
               24 slides stacked that resized every one of them at once: the
               document grew ~2000px, the slide under the reader moved by eight
               times the chrome height, and every scroll-snap point relocated
               mid-gesture. WebKit has no scroll anchoring to absorb it, so the
               first swipe of every visit lurched by most of a slide.
               lvh is the LARGE viewport — a fixed number that the address bar
               cannot move — so the geometry is now static and snap points stay
               put. The chrome clearance dvh was really being used for is handled
               on its own below, by --chrome-bottom, which moves only the caption.
               vh first as the fallback; on iOS Safari vh already means lvh. */
            height: 100vh;
            height: 100lvh;
            overflow: hidden;
            overflow: clip;
            contain: paint;
            cursor: pointer;
            background: #050505;
        }

        .slide-media {
            position: absolute;
            /* Smaller overscan = less bleed at the infinite-scroll wrap */
            inset: -8% 0;
            height: 116%;
            will-change: transform;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        .slide-media img,
        .slide-media video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            background: #050505;
        }

        .slide-media video {
            pointer-events: none;
        }

        .slide-media video::-webkit-media-controls-start-playback-button {
            display: none !important;
            -webkit-appearance: none;
        }

        .slide-media.media-focus-left img,
        .slide-media.media-focus-left video {
            object-position: left center;
        }

        /* Safari can briefly paint a video element black on a cold/private load,
           even when the native poster attribute is present. Keep a real image
           above it until the browser confirms that a video frame is drawable. */
        .slide-media .video-poster {
            z-index: 1;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.18s linear;
        }

        .slide.video-frame-ready .video-poster {
            opacity: 0;
            visibility: hidden;
        }

        /* Subtle vignette so captions stay legible */
        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 35%),
                        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%);
        }

        .slide-caption {
            position: absolute;
            left: clamp(1.25rem, 5vw, 4rem);
            right: clamp(1.25rem, 5vw, 4rem);
            bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px) + var(--chrome-bottom));
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 1.25rem;
            max-width: min(42rem, 100%);
            text-shadow: 0 1px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            /* Settles in as its slide takes the viewport. Toggled by a single
               class on slide change, never per frame. */
            opacity: 0;
            transform: translateY(0.9rem);
            transition:
                opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .slide.is-active .slide-caption {
            opacity: 1;
            transform: translateY(0);
        }

        /* A loop remap swaps the page onto the identical slide one run away.
           Not a pixel on screen changes — but is-active moves to a different
           element, which restarted the caption's entrance on a photograph that
           visibly did not change. That flicker was the most legible tell that
           the infinite scroll was a trick. Suppressed for the one frame the
           remap takes, then transitions come straight back. */
        html.caption-instant .slide-caption {
            transition: none;
        }

        /* The portrait encodes are already cropped to the framing these rules
           were approximating, so re-offsetting would push past the subject. */
        .slide-media.media-precropped img,
        .slide-media.media-precropped video {
            object-position: center center !important;
        }

        .slide-index {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--muted);
            padding-top: 0.6rem;
            flex-shrink: 0;
        }

        .slide-title-wrap { display: flex; flex-direction: column; min-width: 0; }

        .slide-title {
            font-family: var(--font-display);
            font-size: clamp(1.65rem, 4.8vw, 3.75rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0.01em;
        }

        .slide-sub {
            font-family: var(--font-body);
            font-size: clamp(0.72rem, 1.8vw, 0.85rem);
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.4rem;
        }

        /* ---------- Fixed UI ---------- */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: clamp(1rem, 3vw, 2rem) clamp(1.25rem, 5vw, 4rem);
            padding-top: max(clamp(1rem, 3vw, 2rem), env(safe-area-inset-top));
            mix-blend-mode: difference;
            pointer-events: none;
        }

        .brand-mark { pointer-events: auto; min-width: 0; }

        .brand-mark .name {
            font-family: var(--font-display);
            font-size: clamp(1.15rem, 3.5vw, 1.35rem);
            font-weight: 500;
            display: block;
            line-height: 1.1;
        }

        .brand-mark .tagline {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .enter-link {
            pointer-events: auto;
            font-family: var(--font-body);
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            transition: opacity 0.3s ease;
        }

        .enter-link .arrow { transition: transform 0.3s ease; }
        .enter-link:hover .arrow { transform: translateX(4px); }

        /* ---------- Progress rail ---------- */
        .slide-rail {
            position: fixed;
            right: clamp(0.9rem, 2vw, 1.75rem);
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.7rem;
            mix-blend-mode: difference;
        }

        .rail-tick {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            border: 0;
            padding: 0;
            background: rgba(255, 255, 255, 0.45);
            width: 0.75rem;
            height: 2px;
            border-radius: 2px;
            cursor: pointer;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.45s ease;
        }

        /* Widen the hit area well past the 2px visual without moving anything. */
        .rail-tick::before {
            content: '';
            position: absolute;
            width: 2.75rem;
            height: 1.1rem;
            transform: translate(-1.9rem, -0.55rem);
        }

        .rail-tick:hover { background: rgba(255, 255, 255, 0.8); }

        .rail-tick.is-active {
            width: 1.6rem;
            background: #fff;
        }

        /* Scroll / enter hint — always sits below captions */
        .hint {
            position: fixed;
            bottom: max(1rem, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: max-content;
            max-width: calc(100vw - 2rem);
            padding: 0 0.5rem;
            font-size: clamp(0.65rem, 2.4vw, 0.78rem);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            mix-blend-mode: difference;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            pointer-events: none;
            animation: floaty 2.6s ease-in-out infinite;
            white-space: nowrap;
        }

        .hint-full { display: inline; }
        .hint-short { display: none; }

        @keyframes floaty {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.75; }
            50% { transform: translate(-50%, 5px); opacity: 1; }
        }

        /* ---------- Enter / arrive veil ---------- */
        .enter-veil {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-veil.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            /* The veil is opaque but it used to let the page scroll underneath
               it: a visitor who swipes at the loading screen — which is what
               people do — moved one or two slides blind, and then the veil
               lifted somewhere they did not choose. touch-action: none makes
               the overlay swallow gestures that start on it, without touching
               the document's own overflow (setting overflow:hidden on a
               scrolled document clamps scrollY on iOS and would undo the seat). */
            touch-action: none;
        }
        /* First paint: solid cover, no fade-in flash. Fade only on leave. */
        body.is-arriving .enter-veil.active {
            transition: none;
        }
        .enter-veil.is-fading {
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s;
        }

        .enter-veil-text {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(245, 245, 240, 0.85);
            opacity: 0.55;
            animation: veilPulse 1.6s ease-in-out infinite;
        }

        @keyframes veilPulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }

        body.is-arriving .top-bar,
        body.is-arriving .hint,
        body.is-arriving .slide-rail {
            opacity: 0;
        }

        body:not(.is-arriving) .top-bar,
        body:not(.is-arriving) .hint,
        body:not(.is-arriving) .slide-rail {
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
        }

        @media (prefers-reduced-motion: reduce) {
            .hint, .enter-veil-text { animation: none; }
            .slide-media { inset: 0; height: 100%; will-change: auto; }
            .enter-veil, .enter-veil.is-fading { transition: none !important; }
            /* Show every caption outright rather than sliding one in per slide. */
            .slide-caption {
                opacity: 1;
                transform: none;
                transition: none;
            }
            .rail-tick { transition: none; }
        }

        @media (max-width: 768px) {
            :root { --hint-clearance: 5.25rem; }

            .brand-mark .tagline { display: none; }

            /* Avoid expensive fixed-element blending/composited transforms over
               video; both are common sources of Safari scroll flashing. */
            .top-bar,
            .hint,
            .slide-rail {
                mix-blend-mode: normal;
            }

            .hint {
                animation: none;
            }

            .slide-media {
                inset: 0;
                height: 100%;
                will-change: auto;
                backface-visibility: visible;
                transform: none;
            }

            .slide-caption {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px) + var(--chrome-bottom));
            }

            .slide-index { padding-top: 0; font-size: 0.8rem; }

            .slide-title {
                font-size: clamp(1.55rem, 7vw, 2.35rem);
            }

            .slide-sub {
                letter-spacing: 0.1em;
                line-height: 1.35;
            }

            /* Prefer the left side of wide landscape clips on tall phones */
            .slide-media.media-focus-left img,
            .slide-media.media-focus-left video {
                object-position: 18% center;
            }
        }

        @media (max-width: 480px) {
            :root { --hint-clearance: 4.75rem; }

            .top-bar {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .slide-caption {
                left: 1rem;
                right: 1rem;
                max-width: none;
            }

            .hint {
                letter-spacing: 0.16em;
            }

            .hint-full { display: none; }
            .hint-short { display: inline; }

            .slide-rail { gap: 0.55rem; right: 0.7rem; }
            .rail-tick { width: 0.5rem; }
            .rail-tick.is-active { width: 1.1rem; }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            :root { --hint-clearance: 3.5rem; }

            .slide-rail { display: none; }

            .slide-caption {
                bottom: calc(var(--hint-clearance) + env(safe-area-inset-bottom, 0px) + var(--chrome-bottom));
            }

            .slide-title { font-size: clamp(1.25rem, 4vh, 1.85rem); }
            .slide-sub { display: none; }
            .hint { font-size: 0.65rem; }
        }
    </style>
</head>
<body class="is-arriving">
    <header class="top-bar">
        <a class="brand-mark" href="mosaic.html" data-enter>
            <span class="name">Jacob Nadal</span>
            <span class="tagline">The Traversal</span>
        </a>
        <a class="enter-link" href="mosaic.html" data-enter>Enter <span class="arrow">→</span></a>
    </header>

    <main class="slides" id="slides" aria-label="Featured photography and films"></main>

    <nav class="slide-rail" id="slideRail" aria-label="Jump to slide"></nav>

    <div class="hint">
        <span class="hint-full">Scroll — Click to enter</span>
        <span class="hint-short">Scroll · Enter</span>
    </div>
    <div class="enter-veil active" id="enterVeil">
        <span class="enter-veil-text">The Traversal</span>
    </div>

    <!-- Unveil failsafe: runs even if Lenis fails to load. -->
    <script>
        (function () {
            function clearArriveVeil() {
                if (window.__landingNavigating) return;
                document.body.classList.remove('is-arriving');
                var veil = document.getElementById('enterVeil');
                if (!veil) return;
                veil.classList.add('is-fading');
                veil.classList.remove('active');
            }
            // Absolute last resort so local hosting never sticks on the loader.
            setTimeout(clearArriveVeil, 1600);
            window.__clearArriveVeil = clearArriveVeil;
        })();
    </script>
    <!-- No Lenis here any more. The section stepper below owns the wheel, so the
         only thing left for a smooth-scroll library to do was run the transition
         — and routing that through lenis.scrollTo() meant a whole dependency
         sitting between a gesture and the page moving. The Dirty Aesthetic
         landing page tweens window.scrollTo() directly for exactly this reason. -->
    <script>
        // Landing slides — edit this list to change the infinite loop.
        // type: 'image' | 'video'.  sub is optional (leave '' to hide).
        // Video slides name a clip; pickMedia() resolves it to the landscape or
        // portrait encode plus the matching poster.
        const ASSET_V = '?v=20260827';
        const LANDING_SLIDES = [
            { type: 'video', clip: 'icefields-1'   ,                      title: 'Icefields Parkway', sub: 'Banff National Park' },
            { type: 'image', src: 'assets/photos/01.jpg',                        title: 'Takakkaw Falls', sub: 'Yoho National Park' },
            { type: 'image', src: 'assets/photos/cass-and-aiden.jpg',       title: 'Back to Me',      sub: 'Dirty Aesthetic · Cover Art' },
            { type: 'image', src: 'assets/photos/03.jpg',                        title: 'King\u2019s Peak', sub: 'Strathcona Provincial Park' },
            { type: 'video', clip: 'fire-lookout-1',                   title: 'Hidden Lake Lookout', sub: 'North Cascades' },
            { type: 'image', src: 'assets/photos/man-under-snowy-mountain.jpg', title: 'Whistler',    sub: 'Avalanche Safety Training' },
            { type: 'video', clip: 'saskatchewan-1',                             title: 'Saskatchewan', sub: 'Windmill', focus: 'left' },
            { type: 'image', src: 'assets/photos/06.jpg',                        title: 'Kokanee Glacier', sub: 'Provincial Park' },
        ];

        const MOSAIC_URL = 'mosaic.html';
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isTouch =
            window.matchMedia('(pointer: coarse)').matches ||
            (navigator.maxTouchPoints || 0) > 0;
        // Live, not a snapshot: a phone rotating to landscape crosses this exact
        // breakpoint, and leaving the portrait encode in a landscape viewport
        // would crop it far harder than the landscape encode ever was.
        const mobileLayoutMQ = window.matchMedia('(max-width: 768px)');
        let isMobileLayout = mobileLayoutMQ.matches;
        // Dirty Aesthetic's smooth touch behavior comes from leaving iOS on
        // native scrolling (Lenis syncTouch is disabled there). Do the same:
        // Safari keeps CSS scroll-snap, while desktop gets the section stepper.
        //
        // Recomputed, not latched. This was a const read once at parse time, and
        // matchMedia can report the pre-layout width — a page opened in a
        // background tab measures zero and therefore "mobile". A desktop that
        // guessed wrong here kept CSS mandatory snap and never attached the wheel
        // stepper, and under mandatory snap a single wheel notch moves ~100px of a
        // full-viewport slide, never crosses the halfway point and snaps straight
        // back: the page simply refuses to scroll. applyScrollMode() below moves
        // it to whichever path the current viewport actually calls for.
        let useNativeScroll = reduceMotion || isTouch || isMobileLayout;
        // The loop is infinite everywhere. Touch used to build a single finite run
        // so Safari never had to remap scroll during momentum, but that made the
        // last slide a dead end on exactly the devices most people arrive on.
        // normalizeLoop() only ever remaps between gestures — scheduleNativeRecenter()
        // waits for touchend and a settled scroll — so the jump never lands mid-fling,
        // and it swaps between identical runs, so no pixel on screen changes.
        // Reduced-motion still opts out: remapping scroll is itself motion.
        const useInfiniteLoop = !reduceMotion;

        // A 16:9 clip in a portrait phone viewport gets cropped to a narrow strip
        // by object-fit: cover and then upscaled ~2.3x — that upscale, not the
        // codec, is why the loops read as soft on a phone. The portrait encodes
        // are pre-cropped to the same framing at native resolution.
        // Keyed off layout width alone so it matches the <link media> preloads.
        function pickMedia(item) {
            if (item.type !== 'video') return { src: item.src, poster: item.poster };
            const portrait = isMobileLayout;
            return {
                src: (portrait ? 'assets/video/mobile/' : 'assets/video/') + item.clip + '.mp4' + ASSET_V,
                poster: 'assets/posters/' + item.clip + (portrait ? '-m' : '') + '.jpg' + ASSET_V,
            };
        }

        // Always start from the first real slide on (re)load.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        // ---------- Build slides ----------
        // Desktop keeps three complete runs for its document-scroll loop.
        // Touch/mobile builds one finite run so Safari never has to remap or
        // transform the page during momentum.
        const slidesEl = document.getElementById('slides');
        const frag = document.createDocumentFragment();
        // Don't name this `N` — Lenis's minified bundle declares a global `N`.
        const SLIDE_COUNT = LANDING_SLIDES.length;
        const LOOP_COPIES = useInfiniteLoop ? 3 : 1;
        const MIDDLE_COPY = useInfiniteLoop ? 1 : 0;
        const IDX_FIRST_REAL = SLIDE_COUNT * MIDDLE_COPY;

        function createSlide(item, displayIndex, opts = {}) {
            const slide = document.createElement('section');
            slide.className = 'slide';
            const copyIndex = opts.copy ?? MIDDLE_COPY;
            const isMiddleCopy = copyIndex === MIDDLE_COPY;
            slide.dataset.copy = String(copyIndex);
            slide.dataset.slideIndex = String(displayIndex);
            if (!isMiddleCopy) slide.setAttribute('aria-hidden', 'true');

            const media = document.createElement('div');
            media.className = 'slide-media';
            if (item.focus === 'left') media.classList.add('media-focus-left');
            // Portrait encodes are already cropped to this framing, so the CSS
            // nudge would double-apply it.
            if (item.type === 'video' && isMobileLayout) media.classList.add('media-precropped');

            const resolved = pickMedia(item);

            if (item.type === 'video') {
                const v = document.createElement('video');
                // Not once-only: swapping to the other encode drops this class so
                // the poster covers the reload, and it has to be re-earned.
                const markVideoFrameReady = () => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => slide.classList.add('video-frame-ready'));
                    });
                };
                v.muted = true;
                v.defaultMuted = true;
                v.loop = true;
                v.autoplay = Boolean(opts.priority) && !reduceMotion;
                v.controls = false;
                v.setAttribute('aria-hidden', 'true');
                v.setAttribute('muted', '');
                v.setAttribute('loop', '');
                v.setAttribute('playsinline', '');
                v.setAttribute('webkit-playsinline', '');
                v.playsInline = true;
                if (opts.priority && !reduceMotion) v.setAttribute('autoplay', '');
                v.setAttribute('preload', opts.priority ? 'auto' : 'none');
                v.setAttribute('disablepictureinpicture', '');
                if (resolved.poster) v.poster = resolved.poster;
                // Do not uncover Safari's native video surface until playback
                // actually begins; a loaded-but-blocked video shows a play icon.
                v.addEventListener('playing', markVideoFrameReady);

                // Only the opening slide loads eagerly. The duplicate copies used
                // to preload metadata too, on the theory that the loop seam could
                // land on one — but the seam is fixed at 2.5 slides either side of
                // the run boundary, which lands on image slides both ways, so the
                // observer below can attach them like any other clip.
                if (opts.priority) {
                    v.src = resolved.src;
                } else {
                    v.dataset.src = resolved.src;
                }
                media.appendChild(v);
                if (resolved.poster) {
                    const poster = document.createElement('img');
                    poster.className = 'video-poster';
                    poster.src = resolved.poster;
                    poster.alt = '';
                    poster.setAttribute('aria-hidden', 'true');
                    poster.loading = opts.priority ? 'eager' : 'lazy';
                    poster.decoding = 'async';
                    if (opts.priority) poster.fetchPriority = 'high';
                    else if (!isMiddleCopy) poster.fetchPriority = 'low';
                    media.appendChild(poster);
                }
            } else {
                const img = document.createElement('img');
                img.src = resolved.src;
                img.alt = item.title;
                img.loading = opts.priority || opts.nearby ? 'eager' : 'lazy';
                img.decoding = 'async';
                // The slide after the opening clip is the first thing a visitor
                // scrolls to, and it is the heaviest photograph on the page, so it
                // needs the same priority as the hero rather than eager-but-idle.
                if (opts.priority || opts.nearby) img.fetchPriority = 'high';
                // The outer two runs are duplicates of the middle one. Nobody can
                // reach them without first scrolling a long way, but they are in
                // the DOM from the start, and on a phone the browser was pulling
                // ~2MB of them — photographs positioned BEHIND the visitor —
                // while the opening clip was still arriving. They stay lazy; this
                // just stops them bidding against the hero for the connection.
                else if (!isMiddleCopy) img.fetchPriority = 'low';
                media.appendChild(img);
            }

            const caption = document.createElement('div');
            caption.className = 'slide-caption';
            const idx = String(displayIndex + 1).padStart(2, '0');
            caption.innerHTML =
                '<span class="slide-index">' + idx + '</span>' +
                '<span class="slide-title-wrap">' +
                    '<span class="slide-title">' + item.title + '</span>' +
                    (item.sub ? '<span class="slide-sub">' + item.sub + '</span>' : '') +
                '</span>';

            slide.appendChild(media);
            slide.appendChild(caption);
            return slide;
        }

        for (let copy = 0; copy < LOOP_COPIES; copy++) {
            LANDING_SLIDES.forEach((item, i) => {
                const isOpeningSlide = copy === MIDDLE_COPY && i === 0;
                const isOpeningNeighbor = copy === MIDDLE_COPY && i === 1;
                frag.appendChild(createSlide(item, i, {
                    copy,
                    priority: isOpeningSlide,
                    nearby: isOpeningNeighbor,
                }));
            });
        }

        slidesEl.appendChild(frag);
        const slideEls = Array.from(document.querySelectorAll('.slide'));
        const mediaEls = slideEls.map(s => s.firstElementChild);
        // Physical slide index -> its video, so the scroll loop never has to run
        // a querySelector or walk the DOM per frame.
        const videoByIndex = new Map();
        slideEls.forEach((slide, i) => {
            const v = slide.querySelector('video');
            if (v) videoByIndex.set(i, v);
        });

        // Every slide is exactly one viewport tall and they are stacked in order,
        // so slide i's top is (i * SLIDE_H - scroll). Measuring that once and doing
        // arithmetic replaces what used to be ~33 getBoundingClientRect() calls per
        // frame across the parallax and video-visibility passes — each of which
        // forced a synchronous layout while transforms were being written.
        let SLIDE_H = 1;
        function measureSlideHeight() {
            const measured = (slideEls[IDX_FIRST_REAL] && slideEls[IDX_FIRST_REAL].offsetHeight) || 0;
            const next = measured > 200 ? measured : (window.innerHeight || 0);
            // Only ever latch onto a plausible height. Taking a zero here — layout
            // not settled, or a tab that loaded in the background — would make
            // every slide index and scroll target derived from it meaningless,
            // which reads to a visitor as the page refusing to scroll.
            if (next > 200) SLIDE_H = next;
        }
        measureSlideHeight();
        // Re-measure whenever the viewport genuinely changes size, and re-seat
        // onto the slide the visitor was already on.
        //
        // Slides are sized in lvh now, so the iOS address bar retracting no
        // longer resizes anything and the common case here is a no-op — this
        // exists for real size changes: rotation, split view, a desktop window
        // being dragged. Three things had to change:
        //
        //  1. It bailed out entirely when the timer landed during a touch, and
        //     nothing re-armed it — the re-measure was discarded, not deferred,
        //     so SLIDE_H could stay wrong for the rest of the session. It now
        //     reschedules itself instead.
        //  2. touchActive is false throughout the momentum tail, and isSnapping
        //     is never set on the touch path at all, so neither flag kept this
        //     off a live fling. It now also waits for the scroll to be still.
        //  3. It re-seated even when the height had not actually changed, which
        //     turned a stray resize into a visible jump for no reason.
        let viewportSettle = 0;
        function onViewportChange() {
            clearTimeout(viewportSettle);
            // Capture the slide first: measuring changes what "current" means.
            const wasOn = Math.round(currentScroll() / SLIDE_H);
            const settle = () => {
                // Defer, never discard: a dropped re-measure leaves SLIDE_H
                // stale and every index derived from it wrong.
                if (touchActive || isSnapping || !scrollIsStill()) {
                    viewportSettle = setTimeout(settle, 120);
                    return;
                }
                const before = SLIDE_H;
                const wasReal = slideHeightIsReal();
                measureSlideHeight();
                if (SLIDE_H === before) return;   // nothing moved; don't yank
                if (!wasReal) {
                    // First real layout after parsing against a zero-size
                    // viewport. wasOn was derived from the placeholder height and
                    // means nothing, and the loop is still unarmed — start clean
                    // on the opening slide instead of trusting a bogus index.
                    armLoop();
                    seatAtFirstReal();
                } else {
                    const y = realSnapIndex(wasOn) * SLIDE_H;
                    if (Math.abs(window.scrollY - y) > 1) scrollImmediately(y);
                    lastScroll = y;
                }
                resetParallax();
                syncLandingVideos();
                updateActiveSlide(true);
            };
            viewportSettle = setTimeout(settle, 120);
        }
        window.addEventListener('resize', onViewportChange, { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onViewportChange, { passive: true });
        }

        // ---------- Enter navigation ----------
        let navigating = false;

        function revealLanding(force) {
            if (!force && navigating) return;
            navigating = false;
            window.__landingNavigating = false;
            if (typeof window.__clearArriveVeil === 'function') {
                window.__clearArriveVeil();
            } else {
                document.body.classList.remove('is-arriving');
                const veilEl = document.getElementById('enterVeil');
                if (veilEl) {
                    veilEl.classList.add('is-fading');
                    veilEl.classList.remove('active');
                }
            }
            syncLandingVideos();
        }

        function enterSite() {
            if (navigating) return;
            navigating = true;
            window.__landingNavigating = true;
            document.querySelectorAll('.slide-media video').forEach(video => video.pause());
            if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = 0; }
            const v = document.getElementById('enterVeil');
            if (v) {
                v.classList.remove('is-fading');
                v.classList.add('active');
            }
            setTimeout(() => { window.location.href = MOSAIC_URL; }, 420);
        }

        document.querySelectorAll('[data-enter]').forEach(el => {
            el.addEventListener('click', (e) => { e.preventDefault(); enterSite(); });
        });

        let downX = 0, downY = 0, moved = false;
        slidesEl.addEventListener('pointerdown', (e) => {
            downX = e.clientX; downY = e.clientY; moved = false;
        });
        slidesEl.addEventListener('pointermove', (e) => {
            if (Math.abs(e.clientX - downX) > 10 || Math.abs(e.clientY - downY) > 10) moved = true;
        });
        slidesEl.addEventListener('click', () => { if (!moved) enterSite(); });

        // ---------- Desktop smooth scroll / native mobile scroll ----------
        document.documentElement.classList.toggle('native-snap', useNativeScroll);
        let lastScroll = 0;
        let wrapping = false;
        let isSnapping = false;
        let touchActive = false;
        let nativeRecenterTimer = 0;
        // Don't remap until the first real slide is seated — otherwise a 0-height
        // layout pass can clamp wraps forever and freeze the main thread.
        let loopReady = false;

        // Cached by measureSlideHeight(); re-measured on resize/orientation only.
        // Reading offsetHeight here instead would reintroduce a layout flush on
        // every frame of the scroll loop.
        function slideHeight() {
            return SLIDE_H;
        }

        function scrollForIndex(i) {
            return i * slideHeight();
        }

        // Set the moment the visitor moves the page themselves. Every seat below
        // is a hard scrollTo back to slide one, and on a slow first load the last
        // of them can land hundreds of milliseconds after someone has already
        // started swiping — which silently ate their first gesture. Arrival may
        // seat the page; it may not overrule the visitor.
        let visitorHasScrolled = false;
        function markVisitorScroll() { visitorHasScrolled = true; }
        window.addEventListener('touchstart', markVisitorScroll, { passive: true, once: true });
        window.addEventListener('wheel', markVisitorScroll, { passive: true, once: true });
        window.addEventListener('keydown', markVisitorScroll, { passive: true, once: true });

        // SLIDE_H starts at 1 and measureSlideHeight() refuses to latch anything
        // under 200px, so until a real layout has happened it is still 1 — and
        // seating against it would scroll to 8px and call that "slide eight".
        // A viewport of zero is not hypothetical: a page opened in a background
        // tab, or restored from the app switcher, parses before layout.
        function slideHeightIsReal() {
            return SLIDE_H > 200;
        }

        function seatAtFirstReal(force) {
            // The synchronous seat at parse time passes force: nothing can have
            // happened yet, and the page must start on the first real slide.
            if (!force && visitorHasScrolled) return;
            if (!slideHeightIsReal()) return;
            const y = scrollForIndex(IDX_FIRST_REAL);
            if (Math.abs(window.scrollY - y) < 1) return;
            window.scrollTo(0, y);
            lastScroll = y;
        }

        seatAtFirstReal(true);

        function armLoop() {
            if (loopReady) return;
            measureSlideHeight();
            // Arming the loop against a bogus height bakes in a bogus geometry:
            // every index, every remap target and every video decision derives
            // from SLIDE_H. Wait for a real one — onViewportChange() re-measures
            // on the first true layout, and calls back here.
            if (!slideHeightIsReal()) return;
            seatAtFirstReal();
            loopReady = true;
        }

        requestAnimationFrame(() => {
            seatAtFirstReal();
            requestAnimationFrame(armLoop);
        });
        // rAF never runs while the tab is in the background, and the loop is gated
        // on loopReady — so a page opened in a background tab, or throttled on a
        // low-power phone, would come to the foreground with the infinite loop
        // permanently disarmed and the last slide a dead end. Arm it on a timer as
        // well; armLoop() is idempotent, so whichever path runs first wins.
        // It must still arm the loop in that case — it just may not re-seat over
        // a visitor who got there first, which seatAtFirstReal() now enforces.
        setTimeout(armLoop, 400);

        document.documentElement.style.touchAction = 'pan-y';
        document.body.style.touchAction = 'pan-y';
        slidesEl.style.touchAction = 'pan-y';

        window.addEventListener('touchstart', () => {
            touchActive = true;
            isSnapping = false;
            clearTimeout(nativeRecenterTimer);
            // A real touch is also a valid media gesture on iOS. This recovers
            // autoplay when Safari deferred it during a cold/private load.
            syncLandingVideos();
        }, { passive: true });
        window.addEventListener('touchend', () => {
            touchActive = false;
            scheduleNativeRecenter();
        }, { passive: true });
        window.addEventListener('touchcancel', () => {
            touchActive = false;
            scheduleNativeRecenter();
        }, { passive: true });

        // Recenter between identical runs while there is still a full viewport of
        // runway in either direction. The visible pixels do not change.
        function currentScroll() {
            return window.scrollY;
        }

        // iOS momentum runs on the scrolling thread and keeps moving the page for
        // up to a second and a half after the finger leaves. touchActive is false
        // for all of it, so any guard built only on touchActive fires at exactly
        // the moment a hard scrollTo does the most damage. Watching the position
        // itself is the only reliable way to know the page has actually stopped.
        let lastMovedAt = 0;
        let lastSeenScroll = -1;
        const SCROLL_STILL_MS = 140;
        window.addEventListener('scroll', () => {
            const y = window.scrollY;
            if (y !== lastSeenScroll) {
                lastSeenScroll = y;
                lastMovedAt = performance.now();
            }
        }, { passive: true });
        function scrollIsStill() {
            // Never seen a scroll event: nothing has moved, so it is still.
            if (!lastMovedAt) return true;
            return (performance.now() - lastMovedAt) >= SCROLL_STILL_MS;
        }

        function scrollImmediately(y) {
            if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = 0; }
            window.scrollTo({ top: y, left: 0, behavior: 'auto' });
        }

        function syncMatchingLoopVideo(fromY, toY, h) {
            const source = videoByIndex.get(Math.round(fromY / h));
            const target = videoByIndex.get(Math.round(toY / h));
            if (!source || !target) return;

            attachLandingVideo(target);
            if (source.readyState >= 1 && target.readyState >= 1 && Number.isFinite(source.currentTime)) {
                try { target.currentTime = source.currentTime; } catch (_) {}
            }
            if (!source.paused) playLandingVideo(target);
        }

        // A remap lands on the identical slide one run away, so nothing on screen
        // changes — but is-active moves to a different element, which replayed the
        // caption's entrance animation. Re-point it with transitions off for the
        // one frame the remap takes.
        let captionInstantFrame = 0;
        function remapCaption() {
            document.documentElement.classList.add('caption-instant');
            updateActiveSlide(true);
            cancelAnimationFrame(captionInstantFrame);
            captionInstantFrame = requestAnimationFrame(() => {
                captionInstantFrame = requestAnimationFrame(() => {
                    document.documentElement.classList.remove('caption-instant');
                });
            });
        }

        function normalizeLoop() {
            if (!useInfiniteLoop || !loopReady || wrapping || isSnapping || touchActive) return;
            // Never remap while the page is still coasting. scrollTo into a live
            // iOS fling is either ignored or applied with the remaining momentum
            // continuing from the new offset — both read as a jump.
            if (!scrollIsStill()) return;
            const h = slideHeight();
            if (h < 80) return;
            const y = currentScroll();
            const runHeight = SLIDE_COUNT * h;
            // These used to sit 2.5 slides outside the middle run, which is
            // symmetric about the run but NOT about where the visitor starts:
            // the page seats at the run's first slide, so there were 10.5 slides
            // of runway going down and only 2.5 going up. Three backward swipes
            // from the landing and you tripped a whole-run teleport. Pushed out
            // so both directions get a comfortable margin, and both remaps land
            // near the middle of the document rather than close to an edge.
            const upperRecenterPoint = 2.5 * h;
            const lowerRecenterPoint = (SLIDE_COUNT * 2 + 5.5) * h;

            // Entering the first run: move to the same pixels one run lower.
            if (y < upperRecenterPoint) {
                const next = y + runHeight;
                wrapping = true;
                syncMatchingLoopVideo(y, next, h);
                scrollImmediately(next);
                lastScroll = next;
                wrapping = false;
                resetParallax();
                remapCaption();
                return;
            }
            // Entering the third run: move to the same pixels one run higher.
            if (y > lowerRecenterPoint) {
                const next = y - runHeight;
                wrapping = true;
                syncMatchingLoopVideo(y, next, h);
                scrollImmediately(next);
                lastScroll = next;
                wrapping = false;
                resetParallax();
                remapCaption();
            }
        }

        // The remap this schedules teleports the page by a whole run — eight
        // viewports. Landing that inside a live fling is the single most visible
        // fault on the page, and the old 180ms deadline did exactly that: it was
        // re-armed by the scroll listener, but any main-thread stall longer than
        // 180ms (decoding a photograph, starting a clip) let it through while
        // momentum was still running, and touchActive is false for that whole
        // tail. So: only ever remap when the scroll position has actually stopped
        // moving, and re-arm rather than give up when it has not.
        const HAS_SCROLLEND = 'onscrollend' in window;
        function scheduleNativeRecenter(delay) {
            if (!useNativeScroll || !useInfiniteLoop) return;
            // Where scrollend exists it is authoritative and fires below; this
            // timer is only a backstop for older iOS, so it can afford to be slow.
            if (delay === undefined) delay = HAS_SCROLLEND ? 700 : 260;
            clearTimeout(nativeRecenterTimer);
            nativeRecenterTimer = setTimeout(function retry() {
                if (touchActive || !scrollIsStill()) {
                    nativeRecenterTimer = setTimeout(retry, 120);
                    return;
                }
                normalizeLoop();
                syncLandingVideos();
            }, delay);
        }

        // Always snap to the nearby physical slide. normalizeLoop() recenters
        // afterward, avoiding an animated trip through a whole eight-slide run.
        function realSnapIndex(i) {
            return Math.max(0, Math.min(slideEls.length - 1, i));
        }

        // Preserve the current slide through phone/tablet orientation changes.
        window.addEventListener('orientationchange', () => {
            // Capture which slide we were on *before* re-measuring, so the new
            // height doesn't move us to a different photograph.
            const nearestIndex = Math.round(currentScroll() / SLIDE_H);
            setTimeout(() => {
                measureSlideHeight();
                const targetY = scrollForIndex(realSnapIndex(nearestIndex));
                scrollImmediately(targetY);
                lastScroll = targetY;
                resetParallax();
                syncLandingVideos();
                updateActiveSlide();
            }, 220);
        }, { passive: true });

        // ---------- Parallax ----------
        // Writes only. Slide i's offset from the viewport top is (i - scroll/H)
        // viewports, so nothing here needs to ask the layout engine anything.
        const PARALLAX_AMOUNT = isTouch ? -3.2 : -5.5;
        const lastShift = new Array(slideEls.length).fill(null);
        let pFirst = 0, pLast = -1;

        function setMediaShift(i, shift) {
            if (lastShift[i] === shift) return;
            lastShift[i] = shift;
            const media = mediaEls[i];
            if (media) media.style.transform = 'translate3d(0,' + shift + '%,0)';
        }

        function resetParallax() {
            for (let i = 0; i < slideEls.length; i++) setMediaShift(i, 0);
            pFirst = 0;
            pLast = -1;
        }

        function updateParallax() {
            if (useNativeScroll) return;
            if (wrapping) {
                resetParallax();
                return;
            }
            const base = currentScroll() / SLIDE_H;
            // Only the slide under the viewport and its immediate neighbours can
            // be visible, so at most four elements are ever touched per frame.
            const first = Math.max(0, Math.floor(base) - 1);
            const last = Math.min(slideEls.length - 1, Math.floor(base) + 2);
            for (let i = pFirst; i <= pLast; i++) {
                if (i < first || i > last) setMediaShift(i, 0);
            }
            for (let i = first; i <= last; i++) {
                const progress = Math.max(-1, Math.min(1, i - base));
                setMediaShift(i, +(progress * PARALLAX_AMOUNT).toFixed(2));
            }
            pFirst = first;
            pLast = last;
        }

        // ---------- Active slide ----------
        // Drives the caption reveal and the progress rail. Only fires on change,
        // so it costs two class writes per slide rather than anything per frame.
        let activeIndex = -1;
        const railTicks = [];

        function displayIndexOf(physicalIndex) {
            return ((physicalIndex % SLIDE_COUNT) + SLIDE_COUNT) % SLIDE_COUNT;
        }

        function updateActiveSlide(force) {
            const i = Math.max(0, Math.min(slideEls.length - 1, Math.round(currentScroll() / SLIDE_H)));
            if (i === activeIndex && !force) return;
            if (slideEls[activeIndex]) slideEls[activeIndex].classList.remove('is-active');
            activeIndex = i;
            slideEls[i].classList.add('is-active');
            const display = displayIndexOf(i);
            railTicks.forEach((tick, t) => {
                const on = t === display;
                tick.classList.toggle('is-active', on);
                tick.setAttribute('aria-current', on ? 'true' : 'false');
            });
        }

        function raf() {
            // The mode can flip under us (a window narrowed past the breakpoint,
            // a phone rotated). Stand down rather than keep a frame loop running
            // against a path that is now driven by events.
            if (useNativeScroll) { stepperLoopRunning = false; return; }
            normalizeLoop();
            updateParallax();
            updateActiveSlide();
            // Level-triggered on purpose. Driving playback purely from scroll
            // events leaves a clip paused for good whenever a transition is
            // interrupted. The range check inside early-outs in O(1).
            syncLandingVideos();
            requestAnimationFrame(raf);
        }
        // The stepper path runs its own frame loop; the touch path stays entirely
        // event-driven so Safari keeps scrolling on the compositor.
        //
        // The event-driven half is attached unconditionally. Everything it calls
        // is idempotent and derives its answer from the scroll position, so on the
        // stepper path it simply agrees with the frame loop — and attaching it
        // once, up front, is what lets the mode change later without having to
        // wire up listeners on a page that is already running.
        let nativeScrollFrame = 0;
        window.addEventListener('scroll', () => {
            if (nativeScrollFrame) return;
            nativeScrollFrame = requestAnimationFrame(() => {
                nativeScrollFrame = 0;
                syncLandingVideos();
                updateActiveSlide();
                scheduleNativeRecenter();
            });
        }, { passive: true });

        if ('onscrollend' in window) {
            window.addEventListener('scrollend', () => {
                clearTimeout(nativeRecenterTimer);
                if (!touchActive && scrollIsStill()) normalizeLoop();
                syncLandingVideos();
                updateActiveSlide();
            }, { passive: true });
        }
        updateActiveSlide();

        let stepperLoopRunning = false;
        function startStepperLoop() {
            if (stepperLoopRunning || useNativeScroll) return;
            stepperLoopRunning = true;
            requestAnimationFrame(raf);
            updateParallax();
            updateActiveSlide();
        }

        // Put the page on the path the CURRENT viewport calls for. Safe to call
        // repeatedly; it only acts on an actual change.
        function applyScrollMode() {
            const next = reduceMotion || isTouch || isMobileLayout;
            if (next === useNativeScroll) return;
            useNativeScroll = next;
            document.documentElement.classList.toggle('native-snap', useNativeScroll);
            if (useNativeScroll) {
                // Leaving the stepper: raf() stops itself on the next frame, and
                // the parallax offsets it wrote must be cleared or every slide
                // keeps a stale transform.
                resetParallax();
            } else {
                startStepperLoop();
            }
            updateActiveSlide(true);
        }

        startStepperLoop();

        // ---------- Direct navigation ----------
        // Scrolling eight viewports to reach a photograph you can already see on
        // the rail is the slow path; these give the keyboard and the rail a way
        // to jump straight there.
        // Symmetric ease: the slide leaves and arrives at rest, which reads as one
        // deliberate move rather than a throw that decays.
        const easeInOutCubic = (t) => t < 0.5
            ? 4 * t * t * t
            : 1 - Math.pow(-2 * t + 2, 3) / 2;

        // How long one section transition runs. The wheel arbitration below reads
        // animatingUntil to know when a gesture is still in flight.
        const SECTION_DURATION = 620;
        let animatingUntil = 0;
        let targetSlideIndex = -1;
        let transitionToken = 0;
        let tweenFrame = 0;

        // Straight rAF tween over window.scrollTo, lifted from the Dirty Aesthetic
        // landing page. Nothing sits between the gesture and the page moving.
        function tweenTo(y, onDone) {
            if (tweenFrame) cancelAnimationFrame(tweenFrame);
            const from = window.scrollY;
            const distance = y - from;
            if (!distance) {
                if (onDone) onDone();
                return;
            }
            const start = performance.now();
            const step = (now) => {
                const t = Math.min(1, (now - start) / SECTION_DURATION);
                window.scrollTo(0, Math.round(from + distance * easeInOutCubic(t)));
                if (t < 1) {
                    tweenFrame = requestAnimationFrame(step);
                } else {
                    tweenFrame = 0;
                    if (onDone) onDone();
                }
            };
            tweenFrame = requestAnimationFrame(step);
        }

        function goToSlide(physicalIndex, opts = {}) {
            const target = realSnapIndex(physicalIndex);
            // Never arm the deadline for a move that is not happening — at a clamp
            // that would block the wheel for no reason.
            if (target === targetSlideIndex && performance.now() < animatingUntil) return;
            const y = target * SLIDE_H;
            const durationMs = (opts.duration ?? SECTION_DURATION / 1000) * 1000;
            targetSlideIndex = target;
            animatingUntil = performance.now() + durationMs;
            isSnapping = true;
            const token = ++transitionToken;

            let settled = false;
            const settle = () => {
                // A chained gesture retargets mid-flight. If the superseded
                // animation still reports completion, it must not clear the state
                // that now belongs to the newer one.
                if (settled || token !== transitionToken) return;
                settled = true;
                isSnapping = false;
                animatingUntil = 0;
                normalizeLoop();
                syncLandingVideos();
                // normalizeLoop() may have remapped the scroll a whole run; the next
                // gesture re-derives its index from scroll, so drop the stale one.
                targetSlideIndex = -1;
            };

            if (reduceMotion) {
                window.scrollTo(0, y);
                settle();
            } else {
                tweenTo(y, settle);
                // The tween runs on rAF, which stops dead in a background tab. If
                // that happens mid-transition the animation never finishes, so
                // isSnapping stays set, the loop stops remapping and the page is
                // stuck on a half-scrolled slide. Land it on a timer instead —
                // settle() is idempotent, so whichever finishes first wins.
                setTimeout(() => {
                    if (settled || token !== transitionToken) return;
                    if (tweenFrame) { cancelAnimationFrame(tweenFrame); tweenFrame = 0; }
                    if (Math.round(window.scrollY) !== Math.round(y)) window.scrollTo(0, y);
                    settle();
                }, durationMs + 150);
            }
            lastScroll = y;
        }

        // Jump to a display index (0..SLIDE_COUNT-1) via whichever physical copy
        // is closest, so the loop never animates through a whole run.
        function goToDisplayIndex(display) {
            const current = Math.round(currentScroll() / SLIDE_H);
            const currentDisplay = displayIndexOf(current);
            let delta = display - currentDisplay;
            if (useInfiniteLoop) {
                if (delta > SLIDE_COUNT / 2) delta -= SLIDE_COUNT;
                else if (delta < -SLIDE_COUNT / 2) delta += SLIDE_COUNT;
            }
            goToSlide(current + delta);
        }

        window.addEventListener('keydown', (e) => {
            if (navigating || e.metaKey || e.ctrlKey || e.altKey) return;
            const tag = (e.target && e.target.tagName) || '';
            const onControl = tag === 'A' || tag === 'BUTTON';

            let step = 0;
            if (e.key === 'ArrowDown' || e.key === 'PageDown') step = 1;
            else if (e.key === 'ArrowUp' || e.key === 'PageUp') step = -1;
            else if (e.key === ' ' && !onControl) step = e.shiftKey ? -1 : 1;
            else if (e.key === 'Enter' && !onControl) { enterSite(); return; }
            else if (e.key === 'Home') {
                e.preventDefault();
                goToSlide(IDX_FIRST_REAL);
                return;
            } else return;

            e.preventDefault();
            clearTimeout(nativeRecenterTimer);
            // Step from the slide already being travelled to, not from the
            // mid-flight scroll position, so holding an arrow key advances one
            // slide per press instead of stalling against the running transition.
            const from = (targetSlideIndex >= 0 && performance.now() < animatingUntil)
                ? targetSlideIndex
                : Math.round(currentScroll() / SLIDE_H);
            goToSlide(from + step);
        });

        // ---------- Progress rail ----------
        (function buildRail() {
            const rail = document.getElementById('slideRail');
            if (!rail) return;
            LANDING_SLIDES.forEach((item, i) => {
                const tick = document.createElement('button');
                tick.type = 'button';
                tick.className = 'rail-tick';
                tick.dataset.index = String(i);
                tick.setAttribute('aria-label', (i + 1) + '. ' + item.title);
                tick.addEventListener('click', () => goToDisplayIndex(i));
                rail.appendChild(tick);
                railTicks.push(tick);
            });
            // The scroll loop may already have settled activeIndex before the
            // ticks existed, so force the first paint rather than diffing.
            updateActiveSlide(true);
        })();

        // ---------- Section-per-gesture wheel navigation ----------
        //
        // One scroll gesture moves exactly one slide. This replaces the previous
        // behaviour, where Lenis scrolled freely and a debounced magnetic snap
        // pulled to whatever slide the fling happened to end near — so a single
        // trackpad throw could cross three or four photographs.
        //
        // CSS scroll-snap cannot do this either. Under `mandatory` snap a single
        // wheel notch moves ~100px of a full-viewport slide, never crosses the
        // halfway point, and the browser snaps straight back, so the page appears
        // not to move at all. Snap handles a trackpad throw well and a mouse wheel
        // badly, which is why the transition is animated here instead.
        //
        // The hard part is telling a deliberate second gesture apart from the
        // momentum tail of the first: a fling keeps firing wheel events for over a
        // second, well past the 620ms transition, and that tail used to be waiting
        // to steal another step the instant the animation ended. The rule is a
        // plain deadline — input is dropped while a transition runs, and accepted
        // immediately afterwards. Nothing can extend the deadline, so unlike a
        // scheme that waits for momentum to decay before re-arming, it cannot
        // deadlock against a mouse wheel that arrives at a constant rate.
        //
        // Gated on the layout, not on whether a scroll library happened to load.
        // Touch keeps CSS scroll-snap; a pointer device gets the stepper.
        //
        // Attached unconditionally, gated live inside handleWheel. It used to be
        // wrapped in `if (!useNativeScroll)`, which meant a viewport misreported
        // at parse never got a wheel listener at all and could never recover.
        {
            const WHEEL_THRESHOLD = 40;     // accumulated delta before advancing
            const GESTURE_GAP = 90;         // ms of quiet that marks a new gesture
            const CONTINUOUS_ADVANCE = 950; // ms; unbroken input still steps this often
            const SUSTAIN_RATIO = 0.5;      // vs the gesture's peak: sustained, not decaying
            // Momentum is rejected by the *shape* of the stream, not by absolute
            // magnitude. An absolute floor here ("ignore anything under 5px")
            // silently bricked the page on any device whose every event is 1-4px
            // — Magic Mouse, precision trackpads, and slow trackpad swipes. Since
            // the handler preventDefaults, rejecting every event meant no
            // scrolling at all rather than merely a missed step.
            const TAIL_RATIO = 0.06;        // ignore only what is tiny NEXT TO this gesture's peak
            const REARM_MS = 220;           // earliest a fresh push may re-advance
            const RISE_RUN = 3;             // consecutive rising events that mark a new push
            const RISE_FACTOR = 1.15;       // how much bigger each must be to count as rising

            let wheelAccum = 0;
            let lastWheelTime = 0;
            let lastAdvanceAt = 0;
            let sawGapSinceAdvance = true;
            let gesturePeak = 0;
            let lastMagnitude = 0;
            let risingRun = 0;

            function currentSlideIndex() {
                return realSnapIndex(Math.round(currentScroll() / SLIDE_H));
            }

            function handleWheel(event) {
                // Live check: on the touch/snap path the browser owns the wheel.
                if (useNativeScroll) return;
                if (navigating || reduceMotion || event.ctrlKey || !event.deltaY) return;

                // Fail open, never closed. Every step is computed from SLIDE_H, so
                // if that is ever wrong the page would swallow the wheel and move
                // nothing — dead scrolling, with only the rail left working. Rather
                // than preventDefault into a broken stepper, hand the gesture back
                // to the browser and let the page scroll normally.
                if (!(SLIDE_H > 200) || slideEls.length < 2) return;

                event.preventDefault();

                // deltaMode 1 is lines, 2 is pages — normalise both to pixels.
                const multiplier = event.deltaMode === 1 ? 16
                    : event.deltaMode === 2 ? SLIDE_H
                    : 1;
                const delta = event.deltaY * multiplier;
                // The event's own timestamp, not whenever the handler happened to run.
                const now = event.timeStamp || performance.now();
                const magnitude = Math.abs(delta);
                const gap = now - lastWheelTime;

                // Re-measure once per gesture, not per event. Cheap at this rate,
                // and it self-heals a stale height after any viewport change that
                // never fired a resize — an iOS URL bar collapsing, a zoom, a
                // devtools pane opening.
                if (gap > GESTURE_GAP) measureSlideHeight();

                // A momentum tail only ever decays; a new push from the finger has
                // a rising edge. Counting consecutive rises detects fresh intent
                // regardless of how large a given device's deltas are. A uniform
                // mouse wheel never rises, so this can never be the *only* way to
                // advance — that case is served by CONTINUOUS_ADVANCE below, which
                // is what keeps the whole scheme from deadlocking.
                if (gap > GESTURE_GAP) {
                    risingRun = 0;
                    lastMagnitude = 0;
                }
                if (magnitude > lastMagnitude * RISE_FACTOR) risingRun++;
                else risingRun = 0;
                lastMagnitude = magnitude;
                const newPush = risingRun >= RISE_RUN && (now - lastAdvanceAt) >= REARM_MS;

                // Mid-transition. Momentum arrives as an unbroken stream and is
                // dropped, so a fling cannot buy itself extra slides. A distinct new
                // gesture — a pause in front of it, or a clear rising edge — retargets
                // one further along, so a deliberate second swipe during the animation
                // chains smoothly instead of being thrown away.
                if (now < animatingUntil) {
                    lastWheelTime = now;
                    wheelAccum = 0;
                    if ((gap > GESTURE_GAP && magnitude >= WHEEL_THRESHOLD) || newPush) {
                        gesturePeak = Math.max(gesturePeak, magnitude);
                        sawGapSinceAdvance = false;
                        lastAdvanceAt = now;
                        risingRun = 0;
                        const from = targetSlideIndex >= 0 ? targetSlideIndex : currentSlideIndex();
                        goToSlide(from + Math.sign(delta));
                    }
                    return;
                }

                lastWheelTime = now;
                // Only a real pause starts a new gesture, and only then does the peak
                // reset. Holding the peak across the whole unbroken stream is what
                // lets a decaying tail be told apart from sustained input below.
                if (gap > GESTURE_GAP) {
                    sawGapSinceAdvance = true;
                    wheelAccum = 0;
                    gesturePeak = 0;
                }

                // Relative, not absolute: "small" only means something next to this
                // gesture's own peak, so a device that never exceeds 4px still
                // accumulates normally.
                if (gesturePeak && magnitude < gesturePeak * TAIL_RATIO) return;

                gesturePeak = Math.max(gesturePeak, magnitude);
                wheelAccum += delta;
                if (Math.abs(wheelAccum) < WHEEL_THRESHOLD) return;

                // An unbroken stream counts as one gesture however long it runs, so
                // it is held off until either a genuine pause or CONTINUOUS_ADVANCE.
                // Past that window sustained input still steps — a spun wheel keeps
                // arriving near its own peak — while a decaying tail, by then a small
                // fraction of the peak it started from, does not. Judging magnitude
                // against the gesture's own peak separates the two without ever
                // locking the wheel out.
                if (!sawGapSinceAdvance) {
                    const since = now - lastAdvanceAt;
                    const sustained = since >= CONTINUOUS_ADVANCE
                        && magnitude >= gesturePeak * SUSTAIN_RATIO;
                    if (!sustained && !newPush) {
                        wheelAccum = 0;
                        return;
                    }
                }

                const direction = Math.sign(wheelAccum);
                wheelAccum = 0;
                sawGapSinceAdvance = false;
                lastAdvanceAt = now;
                risingRun = 0;
                goToSlide(currentSlideIndex() + direction);
            }

            window.addEventListener('wheel', handleWheel, { passive: false });
        }

        // ---------- Video lifecycle ----------
        // Load upcoming clips shortly before they are needed, and only decode the
        // clip that is actually on screen. This keeps scrolling smooth on phones
        // and avoids burning CPU/GPU on hidden duplicate slides.
        const landingVideos = Array.from(document.querySelectorAll('.slide-media video'));

        function attachLandingVideo(video) {
            const src = video.dataset.src;
            if (!src || video.src) return;
            video.src = src;
            video.removeAttribute('data-src');
            video.preload = 'metadata';
            try { video.load(); } catch (_) {}
        }

        function showLandingVideoStill(video) {
            attachLandingVideo(video);
            // syncLandingVideos() now runs every frame, so this must be idempotent
            // — re-seeking an already-parked clip would thrash the decoder.
            if (video.dataset.parked === '1') return;
            video.dataset.parked = '1';
            video.pause();
            const seekToFirstFrame = () => {
                try { video.currentTime = 0.001; } catch (_) {}
            };
            if (video.readyState >= 2) seekToFirstFrame();
            else video.addEventListener('loadeddata', seekToFirstFrame, { once: true });
        }

        function playLandingVideo(video) {
            attachLandingVideo(video);
            video.muted = true;
            video.defaultMuted = true;
            if (reduceMotion) {
                showLandingVideoStill(video);
                return;
            }
            // play() on an already-playing element still allocates a promise and
            // churns the media pipeline. This used to run once per video per
            // frame for the whole scroll.
            if (!video.paused) return;
            const playPromise = video.play();
            if (playPromise && playPromise.catch) playPromise.catch(() => {});
        }

        // Derives the desired play state from scroll position alone and reconciles
        // every clip against it. Deliberately stateless: the previous version
        // remembered the last visible range and skipped the pass when it hadn't
        // changed, which meant any clip paused by something else — an interrupted
        // scrollTo, a tab switch — stayed paused until the range moved again.
        //
        // Cheap enough to run every frame: no getBoundingClientRect, and both
        // play() and pause() are guarded on the element's current state, so a
        // steady-state frame is nine boolean reads and nothing else.
        function syncLandingVideos() {
            if (document.hidden || navigating) {
                landingVideos.forEach(video => { if (!video.paused) video.pause(); });
                return;
            }
            const base = currentScroll() / SLIDE_H;
            const first = Math.max(0, Math.floor(base));
            const last = Math.min(slideEls.length - 1, Math.ceil(base + 0.88) - 1);

            videoByIndex.forEach((video, i) => {
                if (i >= first && i <= last) playLandingVideo(video);
                else if (!video.paused) video.pause();
            });
        }

        if ('IntersectionObserver' in window) {
            const landingPreloadObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) attachLandingVideo(entry.target);
                });
            // 150% reached a slide and a half in every direction, which from the
            // seat pulled the 1.7MB Saskatchewan clip out of the hidden run ABOVE
            // the visitor while the opening clip was still downloading. 75% still
            // attaches the next clip well before it can be scrolled to — a slide
            // is one viewport, so this is most of a slide's warning — without
            // reaching back past the one behind.
            }, { root: null, rootMargin: '75% 0px', threshold: 0 });
            const landingPlaybackObserver = new IntersectionObserver(syncLandingVideos, {
                root: null,
                threshold: [0, 0.12],
            });
            landingVideos.forEach(video => {
                landingPreloadObserver.observe(video);
                landingPlaybackObserver.observe(video);
            });
        } else {
            landingVideos.forEach(attachLandingVideo);
            window.addEventListener('scroll', syncLandingVideos, { passive: true });
        }

        document.addEventListener('visibilitychange', syncLandingVideos);
        window.addEventListener('pageshow', syncLandingVideos);

        // Re-point every clip at the encode that matches the current layout.
        // Only the media is swapped, never the scroll mode — rebuilding the loop
        // mid-session would undo the seating and the Safari-specific handling.
        function swapVideoVariants() {
            slideEls.forEach((slide, i) => {
                const item = LANDING_SLIDES[Number(slide.dataset.slideIndex)];
                if (!item || item.type !== 'video') return;
                const video = videoByIndex.get(i);
                if (!video) return;

                const next = pickMedia(item);
                const media = slide.firstElementChild;
                if (media) media.classList.toggle('media-precropped', isMobileLayout);

                const posterImg = slide.querySelector('.video-poster');
                if (posterImg) posterImg.src = next.poster;
                video.poster = next.poster;

                if (!video.src) {
                    // Never attached — just retarget the lazy source.
                    video.dataset.src = next.src;
                    return;
                }
                if (video.src.endsWith(next.src)) return;

                const resumeAt = video.currentTime;
                const wasPlaying = !video.paused;
                // Drop back to the poster so the reload doesn't flash black.
                slide.classList.remove('video-frame-ready');
                video.src = next.src;
                video.addEventListener('loadedmetadata', () => {
                    try { video.currentTime = resumeAt % (video.duration || 1); } catch (_) {}
                    if (wasPlaying) playLandingVideo(video);
                }, { once: true });
                try { video.load(); } catch (_) {}
            });
            // The rAF loop reconciles playback on desktop, but the native-scroll
